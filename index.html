<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Meghan & Nolan</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪩</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Raleway:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    /* ===== Design tokens (Direction 2A "Refined Editorial") ===== */
    /* Cream editorial palette; accent kept as the site's bright brand orange. */
    :root {
      --bg:      #f6f2ea;
      --bg-alt:  #efe9dd;
      --ink:     #1a1a1a;
      --muted:   #57504a;
      --faint:   #8a8078;
      --accent:  #f3722b;
      --accent-dark: #d45d1a;
      --hair:    rgba(28, 25, 23, 0.12);
      --serif:   'Bodoni Moda', Georgia, serif;
      --sans:    'Raleway', system-ui, sans-serif;
      --script:  'Sacramento', cursive;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Georgia', serif;
      background: #000; /* Black to match video during password phase */
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
    }
    
    
    /* Video background - fixed overlay that fades out */
    .video-background {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 100;
      overflow: hidden;
      opacity: 1;
      /* ease-in: slow start, fast end */
      transition: opacity 1.5s ease-in;
      pointer-events: none;
      /* Black backstop: when the video is re-composited at the start of the
         fade it can snap ~1-2px off the pixel grid and briefly uncover an
         edge. Painting black behind it (occluded by the opaque video except
         at that hairline seam) means the seam reveals dark — invisible on the
         dark disco video — instead of the white .main-content behind it. It
         fades out together with the video, so it leaves nothing behind. */
      background: #000;
      /* Promote to its own compositing layer up front to minimize that snap. */
      will-change: opacity;
    }

    .video-background video {
      display: block;
      /* Also bleed the video a few px past every edge (parent clips it via
         overflow:hidden) so small shifts keep showing real video, not the
         backstop. Together these make any edge seam imperceptible. */
      width: calc(100% + 6px);
      height: calc(100% + 6px);
      margin: -3px 0 0 -3px;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      transform: translateZ(0);
      backface-visibility: hidden;
    }
    
    /* Dark overlay removed for brighter video */
    .video-background::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0);
      pointer-events: none;
    }
    
    /* Fallback gradient if video doesn't load */
    body.no-video {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    /* Fade out video when content is visible */
    body.content-visible .video-background {
      opacity: 0;
      pointer-events: none;
    }
    
    .container {
      /* Container just holds password page and main content */
    }
    
    .password-page {
      position: fixed;
      top: calc(58vh - 50px); /* Same position as before */
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 200;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      transition: opacity 0.5s ease-out;
    }
    
    .password-page.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Loading state: show "Loading…" and hide the box until the background
       video has painted, so the password box never appears over black. */
    .pw-loading {
      opacity: 0;
      color: #f0d59a;
      font-family: 'Bodoni Moda', serif;
      font-style: italic;
      font-size: 26px;
      letter-spacing: 0.06em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      transition: opacity 0.4s ease;
      pointer-events: none;
    }
    .password-page.is-loading .pw-loading { opacity: 1; }
    .password-page.is-loading .password-input-container,
    .password-page.is-loading .error-message {
      opacity: 0;
      pointer-events: none;
    }
    .password-input-container,
    .error-message { transition: opacity 0.4s ease; }
    /* When not loading, the loading text collapses so it doesn't take space */
    .password-page:not(.is-loading) .pw-loading {
      position: absolute; height: 0; overflow: hidden;
    }
    
    
    .password-page h1 {
      color: #fff;
      margin-bottom: 20px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }
    
    .password-page p {
      color: #fff;
      margin-bottom: 30px;
      font-size: 1.1em;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
    }
    
    /* Position/size wrapper — keeps the box's footprint unchanged */
    .pwbox {
      position: relative;
      width: 100%;
      max-width: 300px;
    }

    .password-input {
      width: 100%;
      height: 50px;
      padding: 0 6px 10px;
      border: none;
      outline: none;
      background: transparent;
      color: #f7e6bd;
      font-family: 'Bodoni Moda', serif;
      font-style: italic;
      font-size: 26px;
      letter-spacing: 0.06em;
      text-align: center;
      caret-color: #e8c583;
      transition: color 0.3s;
      margin: 0;
    }

    .password-input::placeholder {
      color: rgba(232, 197, 131, 0.6);
      font-style: italic;
      text-align: center;
    }

    .password-input:focus {
      outline: none;
    }

    .password-input-container {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      position: relative;
    }

    /* underline: a static hairline + a shimmering gold bar */
    .pwbox__line {
      height: 1px;
      background: rgba(232, 197, 131, 0.30);
    }
    .pwbox__glow {
      height: 2px;
      margin-top: -1.5px;
      background: linear-gradient(90deg, transparent, #f5deb0, #e8c583, transparent);
      background-size: 180% 100%;
      box-shadow: 0 0 10px rgba(232, 197, 131, 0.55);
      animation: pw-shimmer 3.5s linear infinite;
    }

    /* success message that replaces the typed text */
    .pwbox__welcome {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bodoni Moda', serif;
      font-style: italic;
      font-size: 26px;
      letter-spacing: 0.06em;
      color: #f0d59a;
      opacity: 0;
      transform: translateY(4px);
      pointer-events: none;
      transition: opacity .4s ease, transform .4s ease;
    }

    /* sparkles thrown up while typing / on success */
    .pwbox__sparks {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .pwbox__sparks span {
      position: absolute;
      bottom: 14px;
      border-radius: 50%;
      background: #f5deb0;
      box-shadow: 0 0 8px #e8c583;
      opacity: 0;
    }

    /* state classes toggled by JS */
    .pwbox.is-error { animation: pw-shake .5s ease; }
    .pwbox.is-success .pwbox__welcome { opacity: 1; transform: translateY(0); }
    /* Hide the typed text instantly (no fade) so there's no empty frame where
       the "Enter password" placeholder could flash before "Welcome!". */
    .pwbox.is-success .password-input { color: transparent; caret-color: transparent; transition: none; }
    .pwbox.is-success .password-input::-ms-reveal,
    .pwbox.is-success .password-input::-ms-clear { display: none; }
    .pwbox.is-typing .pwbox__sparks span,
    .pwbox.is-success .pwbox__sparks span { animation: pw-spark 1.1s ease-out; }

    @keyframes pw-shimmer {
      0% { background-position: -120% 0; }
      100% { background-position: 220% 0; }
    }
    @keyframes pw-shake {
      0%,100% { transform: translateX(0); }
      15% { transform: translateX(-9px) rotate(-.4deg); }
      30% { transform: translateX(8px) rotate(.4deg); }
      45% { transform: translateX(-7px); }
      60% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
      90% { transform: translateX(2px); }
    }
    @keyframes pw-spark {
      0%   { transform: translateY(6px) scale(0.4); opacity: 0; }
      30%  { opacity: 1; }
      100% { transform: translateY(-34px) scale(1); opacity: 0; }
    }

    /* success fallback color (overridden to transparent by .is-success) */
    .password-input.granted {
      color: #f0d59a;
    }
    
    .btn {
      background: rgba(68, 68, 68, 0.7);
      color: white;
      border: none;
      padding: 0;
      font-size: 24px;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
      font-weight: bold;
      width: 50px;
      height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
      backdrop-filter: blur(10px);
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(68, 68, 68, 0.4);
      background: rgba(68, 68, 68, 0.85);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .error-message {
      color: rgba(232, 197, 131, 0.9);
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
      font-family: 'Bodoni Moda', serif;
      font-style: italic;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
    }
    
    /* ========== MAIN CONTENT STYLES ========== */
    /* Main content sits behind video/password, already in position */
    .main-content {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      font-family: 'Raleway', sans-serif;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 50;
    }
    
    /* When shown - just display it, no animation */
    .main-content.shown {
      display: block;
    }
    
    /* Mobile: flex container for title bar + scroll area */
    @media (max-width: 768px) {
      .main-content.shown {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
    }
    
    /* Site Header */
    .site-header {
      text-align: center;
      padding: 52px 20px 24px;
      background: var(--bg);
    }

    .site-header .kicker {
      font-family: var(--script);
      font-size: 2.1em;
      line-height: 1;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .site-title {
      font-family: var(--serif);
      font-size: 4.6em;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.01em;
      line-height: 1;
      margin-bottom: 16px;
    }

    .site-title .ampersand {
      font-style: normal;
    }

    .site-date {
      font-family: var(--sans);
      font-size: 0.85em;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .site-date .dot { color: var(--accent); margin: 0 6px; }

    .site-date-mobile {
      display: none;
    }

    @media (max-width: 768px) {
      .site-date {
        display: none;
      }

      .site-header .kicker { font-size: 1.7em; }
      .site-title { font-size: 2.4em; }

      .site-date-mobile {
        display: block;
        font-family: var(--sans);
        font-size: 0.72em;
        font-weight: 500;
        color: var(--muted);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-align: center;
        white-space: nowrap;
      }

      .site-date-mobile .dot { color: var(--accent); margin: 0 5px; }
    }
    
    /* Hide mobile elements on desktop */
    .mobile-top-bar,
    .mobile-menu,
    .mobile-scroll-container {
      display: none;
    }
    
    /* Desktop Navigation */
    .site-nav {
      display: flex;
      justify-content: center;
      gap: 38px;
      padding: 16px 20px;
      margin: 8px auto 0;
      max-width: 820px;
      background: var(--bg);
      border-top: 1px solid var(--hair);
      border-bottom: 1px solid var(--hair);
    }

    .site-nav a {
      font-family: var(--sans);
      font-size: 0.78em;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      padding: 3px 0;
      border-bottom: 2px solid transparent;
      transition: color 0.25s, border-color 0.25s;
    }

    .site-nav a:hover {
      color: var(--ink);
    }

    .site-nav a.active {
      color: var(--ink);
      font-weight: 600;
      border-bottom: 2px solid var(--accent);
    }
    
    /* Mobile top bar - flex item with fixed size */
    .mobile-top-bar {
      display: none;
      width: 100%;
      height: 60px;
      min-height: 60px;
      max-height: 60px; /* Prevent growing */
      flex-shrink: 0; /* Prevent shrinking */
      flex-grow: 0; /* Prevent growing */
      background: var(--bg);
      z-index: 1001;
      border-bottom: 1px solid var(--hair);
      touch-action: manipulation;
      position: relative;
    }
    
    /* Mobile countdown bar */
    .mobile-countdown {
      display: none;
      width: 100%;
      padding: 5px 20px;
      background: var(--bg);
      border-bottom: 1px solid #eee;
      align-items: center;
      justify-content: space-around;
      font-family: 'Raleway', sans-serif;
      font-size: 0.9em;
      color: #333;
    }
    
    .countdown-label-left {
      font-family: 'Bodoni Moda', serif;
      font-size: 1.5em;
      font-weight: 400;
      letter-spacing: 1px;
      color: #333;
    }
    
    .countdown-timer {
      display: flex;
      gap: 12px;
    }
    
    .countdown-unit {
      text-align: center;
    }
    
    .countdown-number {
      font-family: 'Bodoni Moda', serif;
      font-size: 1.4em;
      font-weight: 600;
      color: var(--accent);
      display: block;
      font-variant-numeric: tabular-nums;
    }
    
    .countdown-label {
      font-size: 0.75em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
    }
    
    /* Mobile hero photo */
    .mobile-hero-photo {
      display: none;
      width: 100%;
      overflow: hidden;
    }
    
    .mobile-hero-photo img {
      width: 100%;
      height: auto;
      display: block;
      filter: brightness(1.1);
    }
    
    .mobile-top-bar-title {
      position: absolute;
      top: 58%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Sacramento', cursive;
      font-size: 2em;
      font-weight: 400;
      letter-spacing: 1px;
      color: var(--accent);
      text-transform: lowercase;
      white-space: nowrap;
    }

    
    /* Desktop scroll container - full page scrollable */
    .desktop-scroll-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      overflow-x: hidden;
      background: var(--bg);
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE/Edge */
      /* Sticky-footer column: footer sits at the bottom of short pages */
      display: flex;
      flex-direction: column;
    }

    /* Grow to fill so the footer is pushed to the bottom on short pages */
    .desktop-sections { flex: 1 0 auto; }
    
    .desktop-scroll-container::-webkit-scrollbar {
      display: none; /* Chrome/Safari/Opera */
    }
    
    /* Mobile scroll container */
    .mobile-scroll-container {
      display: none;
      background: var(--bg);
    }
    
    /* Mobile hamburger button */
    .hamburger {
      display: none;
      position: absolute;
      top: 50%;
      left: 15px;
      transform: translateY(-50%);
      z-index: 1002;
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Large clickable area for hamburger menu */
    .hamburger-click-area {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 25%;
      height: 100%;
      z-index: 1001;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    
    .hamburger span {
      display: block;
      width: 25px;
      height: 2px;
      background: #333;
      margin: 5px 0;
      transition: all 0.3s;
    }
    
    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    
    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }
    
    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }
    
    /* Mobile menu overlay */
    .mobile-menu {
      display: none;
      position: fixed;
      top: 60px;
      left: 0;
      width: 100%;
      height: calc(100% - 60px);
      background: var(--bg);
      z-index: 1000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }
    
    .mobile-menu.active {
      opacity: 1;
      visibility: visible;
    }
    
    /* Icon scroller in mobile menu */
    .menu-icon-scroller {
      position: absolute;
      bottom: 5vh;
      left: 0;
      width: 100%;
      overflow: hidden;
      padding: 20px 0;
    }
    
    .menu-icon-scroller-top {
      position: absolute;
      top: 4vh;
      left: 0;
      width: 100%;
      overflow: hidden;
      padding: 20px 0;
    }
    
    .icon-track {
      display: flex;
      animation: scroll-icons 20s linear infinite;
      width: fit-content;
    }
    
    .icon-track-reverse {
      display: flex;
      animation: scroll-icons-reverse 20s linear infinite;
      width: fit-content;
    }
    
    .icon-track img,
    .icon-track-reverse img {
      height: 40px;
      width: 40px;
      margin: 0 25px;
      display: inline-block;
      /* color baked into SVG source (#f3722b) for exact, gamut-consistent accent */
    }
    
    /* Desktop vertical icon scrollers */
    .desktop-icon-scroller {
      position: fixed;
      top: 0;
      width: 50px;
      height: 100vh;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
    }
    
    .desktop-icon-scroller.left {
      left: 25px;
    }
    
    .desktop-icon-scroller.right {
      right: 25px;
    }
    
    .desktop-icon-track {
      display: flex;
      flex-direction: column;
      animation: scroll-icons-vertical 15s linear infinite;
    }
    
    .desktop-icon-track-reverse {
      display: flex;
      flex-direction: column;
      animation: scroll-icons-vertical-reverse 15s linear infinite;
    }
    
    .desktop-icon-track img,
    .desktop-icon-track-reverse img {
      width: 36px;
      height: 36px;
      margin: 20px auto;
      display: block;
      /* color baked into SVG source (#f3722b) for exact, gamut-consistent accent */
      opacity: 0.7;
    }
    
    @keyframes scroll-icons-vertical {
      0% {
        transform: translateY(0);
      }
      100% {
        transform: translateY(-50%);
      }
    }
    
    @keyframes scroll-icons-vertical-reverse {
      0% {
        transform: translateY(-50%);
      }
      100% {
        transform: translateY(0);
      }
    }
    
    /* Hide desktop scrollers on mobile */
    @media (max-width: 768px) {
      .desktop-icon-scroller {
        display: none;
      }
    }
    
    /* Hide on narrower desktops where they'd overlap content */
    @media (max-width: 1200px) {
      .desktop-icon-scroller {
        display: none;
      }
    }

    @keyframes scroll-icons-reverse {
      0% {
        transform: translateX(-50%);
      }
      100% {
        transform: translateX(0);
      }
    }
    
    @keyframes scroll-icons {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }
    
    .mobile-menu-header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .mobile-menu-title {
      font-family: 'Raleway', sans-serif;
      font-size: 0.9em;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #333;
      margin-bottom: 30px;
    }
    
    .mobile-menu-couple {
      font-family: 'Bodoni Moda', serif;
      font-size: 2.5em;
      font-weight: 400;
      color: #1a1a1a;
      line-height: 1.3;
    }
    
    .mobile-menu-couple .ampersand {
      font-style: normal;
    }
    
    .mobile-menu-date {
      font-family: 'Raleway', sans-serif;
      font-size: 0.85em;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #333;
      margin-top: 15px;
    }
    
    .mobile-menu nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      position: relative;
      padding: 80px 0;
    }
    
    .mobile-menu nav a {
      font-family: 'Raleway', sans-serif;
      font-size: 1.1em;
      font-weight: 400;
      color: #333;
      text-decoration: none;
      letter-spacing: 1px;
    }
    
    .mobile-menu nav a.active {
      border-bottom: 2px solid var(--accent);
      padding-bottom: 2px;
      font-weight: 600;
    }
    
    /* Page sections */
    .page-section {
      display: none;
      padding: 0 20px 60px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    
    .page-section.active {
      display: block;
    }
    
    /* Mobile: sections container and page sections fill available height */
    @media (max-width: 768px) {
      .mobile-sections {
        /* Grow to fill the space above the footer (sticky footer), but let
           content taller than the viewport push past and scroll. */
        flex: 1 0 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      /* Sections must fill the full mobile width. In the flex column the base
         `margin: 0 auto` is an auto cross-margin, which collapses each section
         to its content width; reset it so they stretch edge to edge. */
      .mobile-sections .page-section {
        margin: 0;
        max-width: none;
        align-self: stretch;
      }

      /* Active section is its natural height on normal pages; the fill-screen
         pages (photos/registry) opt into flex:1 via their own rules below. */
      .mobile-scroll-container .page-section.active {
        display: block;
      }
    }
    
    .page-section h2 {
      font-family: 'Bodoni Moda', serif;
      font-size: 2.5em;
      font-weight: 400;
      color: #1a1a1a;
      text-align: center;
      margin-bottom: 40px;
    }
    
    .page-section p {
      font-family: 'Raleway', sans-serif;
      font-size: 1.1em;
      line-height: 1.8;
      color: #444;
      max-width: 800px;
      margin: 0 auto 20px;
    }
    
    /* ===== Home: hero + countdown overlay ===== */
    .hero-block {
      max-width: 820px;
      margin: 28px auto 0;
    }

    .hero {
      position: relative;
      border-radius: 6px;
      overflow: hidden;
    }

    .hero-img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      object-position: center bottom;
      display: block;
      filter: brightness(1.05);
    }

    .hero-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 8, 6, 0) 42%, rgba(10, 8, 6, 0.72) 100%);
    }

    .hero-countdown {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 24px;
      text-align: center;
      color: #fff;
    }

    .hero-countdown .cd-lbl {
      font-family: var(--sans);
      font-size: 0.68em;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.82);
    }

    .cd-clock {
      margin-top: 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 24px;
    }

    .cd-unit { text-align: center; }

    .cd-num {
      font-family: var(--serif);
      font-size: 2.5em;
      line-height: 1;
      display: inline-block;
      min-width: 1.6em;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .cd-num.days { min-width: 2.2em; }
    .cd-num.hl { color: #ffd7ad; }

    .cd-u {
      display: block;
      font-family: var(--sans);
      font-size: 0.6em;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      margin-top: 6px;
    }

    .cd-sep {
      font-family: var(--serif);
      font-size: 2.5em;
      line-height: 1;
      color: rgba(255, 255, 255, 0.4);
    }

    /* ===== Home: schedule of events ===== */
    .sched-head {
      text-align: center;
      padding: 44px 0 6px;
    }

    .sched-head .kicker {
      font-family: var(--script);
      font-size: 1.9em;
      line-height: 1;
      color: var(--accent);
    }

    .sched-head h2 {
      margin: 6px 0 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 2em;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .events-list {
      max-width: 760px;
      margin: 0 auto;
    }

    .event {
      display: grid;
      grid-template-columns: 140px 1px 1fr;
      gap: 30px;
      padding: 28px 0;
      border-top: 1px solid var(--hair);
      text-align: left;
    }

    .event:last-child { border-bottom: 1px solid var(--hair); }

    .event .when { text-align: right; }

    .event .when .d {
      font-family: var(--serif);
      font-size: 0.95em;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .event .when .m {
      font-size: 0.78em;
      letter-spacing: 0.1em;
      color: var(--faint);
      margin-top: 4px;
    }

    .event .rule { background: var(--hair); }

    .event h3 {
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: 1.55em;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .event .time {
      margin-top: 6px;
      font-family: var(--sans);
      font-size: 0.98em;
      color: #4a433d;
      line-height: 1.5;
    }

    /* Desktop keeps the <br> two-line time; the mobile "For a" joiner is hidden */
    .event .time .tj { display: none; }

    .event .venue {
      margin-top: 4px;
      font-family: var(--sans);
      font-size: 0.98em;
    }

    .event .venue a {
      color: var(--accent);
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
    }

    .event .venue a:hover { color: var(--accent-dark); }

    .event .after {
      margin-top: 8px;
      font-family: var(--sans);
      font-size: 0.98em;
      color: #4a433d;
      line-height: 1.5;
    }

    .event .addr {
      margin-top: 3px;
      font-family: var(--sans);
      font-size: 0.88em;
      color: var(--faint);
    }

    .chip {
      display: inline-block;
      margin-top: 12px;
      font-family: var(--sans);
      font-size: 0.72em;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid rgba(28, 25, 23, 0.2);
      border-radius: 999px;
      padding: 5px 12px;
    }

    /* ===== Site footer (shown at the bottom of every page) ===== */
    .site-footer {
      /* Desktop: match the nav/title bar width (both are max-width 820px,
         centered), so the footer band lines up under the nav. */
      /* The scroll container is a flex column; an explicit width is needed so
         the band fills its 820px max — otherwise the `margin: 0 auto` auto
         margins suppress flex stretch and it collapses to its content width. */
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 20px 48px;
      text-align: center;
      background: var(--bg-alt);
    }

    .site-footer .mono {
      font-family: var(--serif);
      font-size: 1.5em;
      letter-spacing: 0.14em;
      color: var(--ink);
    }

    .site-footer .mono .dot { color: var(--accent); }

    .site-footer .script {
      margin-top: 10px;
      font-family: var(--script);
      font-size: 1.7em;
      color: var(--accent);
    }

    .site-footer .sub {
      margin-top: 8px;
      font-family: var(--sans);
      font-size: 0.72em;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--faint);
    }

    /* Map link (SVG pin) — kept for inline use */
    .map-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      transition: transform 0.2s, color 0.2s;
    }

    .map-link:hover {
      transform: scale(1.15);
      color: var(--accent-dark);
    }

    .map-link svg {
      width: 18px;
      height: 18px;
      display: block;
    }
    
    /* Photo grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 40px;
    }
    
    .photo-grid img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }
    
    /* ===================== Photo gallery ===================== */
    .photos-root { max-width: 940px; margin: 0 auto; padding: 0 20px; }

    /* mode toggle pill */
    .pg-toggle { display: flex; justify-content: center; padding: 6px 0 26px; }
    .pg-toggle-inner {
      display: inline-flex; background: var(--bg-alt);
      border-radius: 999px; padding: 4px;
    }
    .pg-tab {
      font-family: var(--sans); font-size: 0.72em; letter-spacing: 0.14em;
      text-transform: uppercase; font-weight: 600; padding: 9px 20px;
      border: none; border-radius: 999px; cursor: pointer;
      background: transparent; color: var(--muted);
      transition: background 0.25s, color 0.25s; white-space: nowrap;
    }
    .pg-tab.active {
      background: var(--accent); color: var(--bg);
      box-shadow: 0 3px 8px rgba(243, 114, 43, 0.35);
    }
    /* swipe is a mobile-only mode */
    .pg-tab[data-mode="swipe"] { display: none; }

    /* panels */
    .pg-panel { display: none; }
    .pg-panel.active { display: block; }

    /* ---- gallery (masonry) ---- */
    /* JS distributes cells into the shortest column for an even tail across
       browsers (CSS multicol balancing differs on iOS Safari). */
    .pg-grid { display: flex; align-items: flex-start; gap: 14px; padding-bottom: 8px; }
    .pg-col { flex: 1 1 0; min-width: 0; }
    .pg-cell {
      display: block; width: 100%; margin: 0 0 14px;
      padding: 0; border: none; border-radius: 4px; overflow: hidden;
      cursor: zoom-in; background: none; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }
    .pg-cell img { display: block; width: 100%; height: auto; }

    /* ---- slideshow ---- */
    /* Desktop: image sits at stage height with a drop shadow (no tan letterbox) */
    .pg-stage { position: relative; height: 560px; }
    .pg-slide {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      height: 100%; width: auto; max-width: 100%; object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 18px 44px rgba(28, 25, 23, 0.28), 0 4px 12px rgba(28, 25, 23, 0.16);
      opacity: 0; transition: opacity 0.8s ease;
    }
    .pg-slide.show { opacity: 1; }
    .pg-controls {
      display: flex; align-items: center; justify-content: center;
      gap: 20px; padding: 22px 0 6px;
    }
    .pg-nav, .pg-play {
      border-radius: 50%; cursor: pointer; display: inline-flex;
      align-items: center; justify-content: center; line-height: 1;
    }
    .pg-nav {
      width: 48px; height: 48px; border: 1px solid rgba(28, 25, 23, 0.18);
      background: #fff; color: var(--ink); font-size: 20px;
    }
    .pg-play {
      width: 52px; height: 52px; border: none; background: var(--accent);
      color: #fff; font-size: 14px; box-shadow: 0 8px 20px rgba(243, 114, 43, 0.35);
    }
    .pg-count {
      margin-left: 6px; font-family: var(--serif); font-size: 1em;
      color: var(--muted); font-variant-numeric: tabular-nums;
    }

    /* ---- swipe (mobile) ---- */
    /* Wider + taller now that the action buttons are gone. Negative side
       margin widens the card past the .photos-root { padding: 0 16px } gutter. */
    .pg-swipe-panel {
      margin: 0 -10px;
      height: 70vh;                  /* fallback for browsers without dvh */
      height: calc(100dvh - 164px);  /* fit under top bar + toggle, with bottom gap matching the top gap */
    }
    /* Flex column so the card stack fills the space above the caption line. */
    .pg-swipe-panel.active { display: flex; flex-direction: column; }
    .pg-swipe-stack {
      position: relative; margin: 4px 4px 0; touch-action: none; overscroll-behavior: contain;
      flex: 1 1 auto; min-height: 0;
    }
    .pg-swipe-caption {
      flex: 0 0 auto; text-align: center;
      font-family: var(--serif); font-style: italic; font-weight: 400;
      font-size: 1.15em; letter-spacing: 0.01em; line-height: 1.3;
      color: var(--muted);
      /* Negative top pulls the line up into the toggle's bottom padding so the
         gap above the text matches the gap below it (stack has a 4px top margin). */
      margin: -12px 6px 10px;
    }
    .pg-swipe-done {
      position: absolute; inset: 0; z-index: 0;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; text-align: center; padding: 0 30px;
    }
    .pg-done-title { font-family: var(--script); font-size: 2.1em; color: var(--accent); line-height: 1.1; }
    .pg-done-sub { margin-top: 6px; font-size: 0.72em; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
    .pg-reset {
      margin-top: 18px; font-family: var(--sans); font-size: 0.72em; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
      background: transparent; border: 1px solid rgba(28, 25, 23, 0.25);
      border-radius: 999px; padding: 9px 20px; cursor: pointer;
    }
    .pg-card {
      position: absolute; inset: 0; border-radius: 20px; overflow: hidden;
      background: #fff; box-shadow: 0 20px 44px rgba(0, 0, 0, 0.28);
      touch-action: none; will-change: transform;
    }
    .pg-card img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .pg-stamp {
      position: absolute; top: 24px; pointer-events: none; font-family: var(--sans);
      font-weight: 800; font-size: 1.6em; letter-spacing: 0.1em; padding: 8px 18px;
      border: 3px solid #fff; border-radius: 12px; text-transform: uppercase; color: #fff; opacity: 0;
    }
    /* LOVE stamp appears on the side OPPOSITE the swipe direction.
       Default = left (shown while swiping right); .on-right flips it. */
    .pg-stamp.love { left: 18px; right: auto; transform: rotate(-14deg); background: #3f9d5a; }
    .pg-stamp.love.on-right { left: auto; right: 18px; transform: rotate(14deg); }
    .pg-scrim {
      position: absolute; left: 0; right: 0; bottom: 0; height: 96px; pointer-events: none;
      background: linear-gradient(180deg, rgba(10,8,6,0) 0%, rgba(10,8,6,0.55) 100%);
    }
    .pg-counts {
      position: absolute; left: 14px; right: 14px; bottom: 14px;
      display: flex; justify-content: space-between; pointer-events: none;
    }
    .pg-counts.pg-counts-solo { justify-content: flex-end; }
    /* love count pill sits a touch bigger, bottom-right (mockup 2F) */
    .pg-counts-solo .pg-chip.love { font-size: 0.95em; padding: 8px 15px; background: rgba(63,157,90,0.92); }
    .pg-chip {
      display: inline-flex; align-items: center; gap: 6px; font-family: var(--sans);
      font-weight: 700; font-size: 0.85em; color: #fff; padding: 6px 12px;
      border-radius: 999px; font-variant-numeric: tabular-nums;
    }
    .pg-chip.love { background: rgba(63, 157, 90, 0.9); }

    /* "swipe us" hint overlay (treatment 2F): sits inside the top card,
       fades away after the first drag. */
    .pg-hint {
      position: absolute; inset: 0; z-index: 9; pointer-events: none; border-radius: inherit;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      background: radial-gradient(ellipse at center, rgba(10,8,6,0.42) 0%, rgba(10,8,6,0.06) 68%);
      transition: opacity 0.45s ease;
    }
    .pg-hint.hidden { opacity: 0; }
    .pg-hint-word {
      font-family: var(--script); font-size: 3.2em; line-height: 1;
      color: rgba(255,255,255,0.96); text-shadow: 0 2px 18px rgba(10,8,6,0.55);
    }
    .pg-hint-arrow {
      font-size: 1.7em; color: rgba(255,255,255,0.9); text-shadow: 0 2px 12px rgba(10,8,6,0.5);
      animation: pg-nudge 1.6s ease-in-out infinite;
    }
    @keyframes pg-nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(12px); } }
    @media (prefers-reduced-motion: reduce) { .pg-hint-arrow { animation: none; } }

    /* ---- lightbox (shared, appended once) ---- */
    .pg-lightbox {
      position: fixed; inset: 0; z-index: 1200; background: rgba(10, 8, 6, 0.92);
      display: none; align-items: center; justify-content: center; padding: 40px;
    }
    .pg-lightbox.open { display: flex; }
    .pg-lightbox img {
      max-width: 92vw; max-height: 88vh; object-fit: contain;
      border-radius: 6px; box-shadow: 0 24px 70px rgba(0,0,0,0.7);
    }
    .pg-lb-btn {
      position: absolute; background: rgba(255,255,255,0.12); color: #fff; border: none;
      cursor: pointer; width: 52px; height: 52px; border-radius: 50%; font-size: 26px;
      line-height: 1; display: inline-flex; align-items: center; justify-content: center;
    }
    .pg-lb-btn:hover { background: rgba(255,255,255,0.22); }
    .pg-lb-prev { left: 20px; top: 50%; transform: translateY(-50%); z-index: 2; }
    .pg-lb-next { right: 20px; top: 50%; transform: translateY(-50%); z-index: 2; }
    .pg-lb-close { top: 20px; right: 20px; width: 44px; height: 44px; font-size: 22px; z-index: 3; }
    /* Full-height transparent tap zones so tapping either side navigates */
    .pg-lb-zone {
      position: absolute; top: 0; bottom: 0; width: 33%; z-index: 1;
      background: none; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .pg-lb-zone-prev { left: 0; }
    .pg-lb-zone-next { right: 0; }

    /* Photos page: hide the big mobile header (consistent with other inner pages) */
    @media (max-width: 768px) {
      .photos-page-active .mobile-scroll-container .site-header { display: none; }

      .photos-root { padding: 0 16px; }
      .pg-grid { gap: 10px; }
      .pg-cell { margin-bottom: 10px; box-shadow: 0 5px 14px rgba(0,0,0,0.12); }
      /* Mobile: bigger, a rounded card that cover-fills, with a drop shadow */
      .pg-stage {
        height: 64vh; border-radius: 14px; overflow: hidden;
        box-shadow: 0 16px 38px rgba(28, 25, 23, 0.26), 0 4px 12px rgba(28, 25, 23, 0.14);
      }
      .pg-slide {
        top: 0; left: 0; transform: none; inset: 0;
        width: 100%; height: 100%; object-fit: cover;
        border-radius: 0; box-shadow: none;
      }
      .pg-tab { font-size: 0.64em; padding: 9px 15px; letter-spacing: 0.1em; }
      .pg-tab[data-mode="swipe"] { display: inline-block; }  /* swipe shown on mobile */
      .pg-tab[data-mode="slideshow"] { display: none; }      /* slideshow hidden on mobile */

      /* Swipe/Slideshow: full-height media, no footer (Gallery keeps the footer) */
      .photos-page-active.pg-immersive .site-footer { display: none; }

      /* Bigger, easier lightbox nav on touch screens */
      .pg-lightbox { padding: 20px; }
      .pg-lb-btn { width: 60px; height: 60px; font-size: 30px; background: rgba(255,255,255,0.18); }
      .pg-lb-prev { left: 10px; }
      .pg-lb-next { right: 10px; }
    }
    
    /* Registry — full-bleed two-column split (photo + copy + Zola CTA) */
    /* Break the registry section out of the max-width/padding shared by the
       other page-sections so the split runs edge to edge. */
    #section-registry {
      max-width: none;
      margin: 0;
      padding: 0;
    }

    /* Selectors are #section-registry-scoped so they outrank the generic
       `.page-section h2/p` rules (alignment, size, color, max-width, margins). */
    #section-registry .reg-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 560px;
    }

    #section-registry .reg-photo { overflow: hidden; }
    #section-registry .reg-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Keep both faces framed in the crop (photo_13 focal ~48% 26%) */
      object-position: 48% 26%;
      display: block;
    }

    #section-registry .reg-copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 70px 62px;
    }
    #section-registry .reg-script {
      font-family: 'Sacramento', cursive;
      font-size: 34px;
      line-height: 1;
      color: var(--accent);
      text-align: left;
    }
    #section-registry .reg-title {
      margin: 10px 0 0;
      font-family: 'Bodoni Moda', serif;
      font-weight: 500;
      font-size: 52px;
      line-height: 1.08;
      color: var(--ink);
      text-align: left;
    }
    #section-registry .reg-body {
      margin: 22px 0 0;
      max-width: none;
      font-family: 'Raleway', sans-serif;
      font-size: 15px;
      line-height: 1.85;
      color: var(--muted);
      text-align: left;
      text-wrap: pretty;
    }
    #section-registry .reg-cta {
      margin-top: 32px;
      align-self: flex-start;
      font-family: 'Raleway', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--accent);
      padding: 18px 40px;
      text-decoration: none;
      transition: background .2s;
    }
    #section-registry .reg-cta:hover { background: var(--ink); }

    @media (max-width: 768px) {
      /* Hide the big mobile hero header (kicker + names + date) on registry,
         so the split photo sits right under the top bar (like Photos). */
      .registry-page-active .mobile-scroll-container .site-header { display: none; }

      #section-registry .reg-split { grid-template-columns: 1fr; min-height: 0; }
      #section-registry .reg-photo { height: 296px; }
      /* bias the crop upward so faces are not cut off */
      #section-registry .reg-photo img { object-position: 48% 18%; }

      #section-registry .reg-copy   { padding: 28px 26px 44px; }
      #section-registry .reg-script { font-size: 28px; }
      #section-registry .reg-title  { font-size: 42px; }
      #section-registry .reg-body   { margin-top: 14px; font-size: 14px; line-height: 1.8; }
      #section-registry .reg-cta    { margin-top: 24px; align-self: stretch; text-align: center; padding: 18px 20px; letter-spacing: 0.18em; }
    }

    /* Desktop: match the gallery photo-wall width (940px, centered) instead of
       full-bleed, give the copy a cream panel, and add breathing room between
       the section and the nav bar above / footer below. */
    @media (min-width: 769px) {
      #section-registry .reg-split {
        max-width: 940px;
        margin: 44px auto 56px;
      }
      #section-registry .reg-copy {
        background: var(--bg-alt);
        padding: 56px 52px;
      }
    }
    
    /* Q+A FAQ Accordion styles */
    .qa-container {
      max-width: 700px;
      margin: 0 auto;
      margin-top: 20px;
    }
    
    .qa-item {
      margin-bottom: 15px;
      border-radius: 8px;
      overflow: hidden;
    }
    
    .qa-question {
      background: var(--accent);
      color: #fff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      cursor: pointer;
      font-family: 'Raleway', sans-serif;
      font-size: 1.05em;
      font-weight: 500;
      transition: background 0.2s;
    }
    
    .qa-question:hover {
      background: var(--accent-dark);
    }
    
    .qa-icon {
      font-size: 1.5em;

  <!-- Shared, deterministic rowing-game physics. Injected by build.js from
       backend/src/game-sim.js so the browser runs the EXACT code the Lambda uses
       to verify runs. Defines window.GameSim. Do not edit here. -->
  <script>
    /*
 * SHARED, DETERMINISTIC rowing-game simulation.
 *
 * This exact file runs in TWO places:
 *   1. The browser (build.js injects it into template.html at __GAME_SIM__), for
 *      live play + rendering.
 *   2. The Lambda (backend/src/game.js requires it), to REPLAY a submitted run
 *      and compute the authoritative distance.
 *
 * Because the server trusts only its own replay, the two must produce identical
 * results for the same (seed, inputTicks). To keep it engine-independent
 * (V8 in Node vs whatever the guest's browser uses), the physics uses ONLY
 * IEEE-754-deterministic operations: + - * /, comparisons, Math.floor,
 * Math.imul, and a seeded integer PRNG. NO Math.random, Math.sin, Math.pow, etc.
 *
 * Rendering (oars, wake, boat tilt, colors) lives in the browser engine ONLY and
 * must never feed back into physics/collision here. Collision uses the boat hull
 * position/hitbox exclusively, so replay stays exact.
 *
 * If you change any physics/course constant below, bump COURSE_VERSION so old
 * (incompatible) submissions are rejected by the server.
 *
 * Exposed as `GameSim` on the browser global and as module.exports in Node.
 * The whole module is wrapped so nothing but `GameSim` leaks into the page.
 */
(function (root, factory) {
  var api = factory();
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.GameSim = api;
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var COURSE_VERSION = 2;

  // ---- Logical world (world units; render scales to fit the stage) ----
  var W = 900;            // reference width  (desktop shows ~this many world units)
  var H = 600;            // world channel height (always fully visible vertically)
  var BOAT_X_FRAC = 0.28; // boat's fixed horizontal screen position (fraction of view)
  var BOAT_HW = 28;       // boat hull half-width  (collision)
  var BOAT_HH = 8;        // boat hull half-height (collision)

  // ---- Physics (per fixed tick; DT is informational, constants fold it in) ----
  // Faster than v1: quicker start, snappier horizontal + vertical movement.
  var DT = 1 / 60;
  var GRAV = 0.22;          // downward accel when NOT pressed
  var LIFT = 0.46;          // upward accel when pressed (net -0.24 while held)
  var VY_MAX = 6.4;         // terminal vertical speed
  var SPEED0 = 3.7;         // starting forward speed (units/tick) -- starts fast
  var SPEED_RAMP = 0.00004; // forward speed gained per world unit travelled
  var SPEED_MAX = 7.4;

  // ---- Course geometry ----
  var SEG_W = 70;         // world units per obstacle segment
  var ANCHOR_SEG = 6;     // cave-center anchors spaced every ANCHOR_SEG segments
  // (wide spacing keeps the channel's vertical slope followable by the boat)
  var CENTER_MIN = 170;   // min channel-center Y
  var CENTER_SPAN = 230;  // channel center ranges CENTER_MIN .. CENTER_MIN+CENTER_SPAN
  var START_GAP = 360;    // vertical gap between banks at the start
  var MIN_GAP = 205;      // gap floor once fully narrowed
  var NARROW = 0.9;       // gap lost per segment travelled
  var SAFE_SEG = 12;      // no obstacles before this segment (orientation grace)
  var OBST_EVERY = 3;     // only every Nth segment may hold an obstacle (guarantees
  // >= (OBST_EVERY-1)*SEG_W spacing, so no impossible back-to-back pinches)
  var OBST_PROB = 0.6;    // chance an eligible segment spawns an obstacle

  // Obstacle sizes (world units)
  var ROCK_W = 30;        // bank-attached rock cluster
  var BOAT_OW = 54, BOAT_OH = 18; // another boat, free-floating mid-channel
  var BRIDGE_W = 30;      // bridge piers (barrier with a central arch gap)

  // Cap replay/record length (~8 min at 60fps) to bound Lambda compute.
  var MAX_TICKS = 60 * 60 * 8;

  var UNITS_PER_METER = 6; // distance scaling -> "meters" (rowing feel)

  // -------------------------------------------------------------------------
  // Deterministic hashing: map (seed, k, salt) -> float in [0,1). Integer ops
  // only (xmur3-style mix) plus one final division. Allows O(1) random access to
  // any segment, so client and server agree without sequential PRNG state.
  // -------------------------------------------------------------------------
  function hash01(seed, k, salt) {
    var h = (seed ^ Math.imul(k + 1, 0x9e3779b1) ^ Math.imul(salt + 1, 0x85ebca77)) >>> 0;
    h = Math.imul(h ^ (h >>> 16), 0x45d9f3b) >>> 0;
    h = Math.imul(h ^ (h >>> 16), 0x45d9f3b) >>> 0;
    h = (h ^ (h >>> 16)) >>> 0;
    return h / 4294967296;
  }

  function smooth(t) { return t * t * (3 - 2 * t); } // smoothstep, multiply-only

  function makeCourse(seed) {
    seed = seed >>> 0;

    function anchor(i) { return hash01(seed, i, 0); }

    // Ceiling / floor / center at an arbitrary world-x. The center is smoothly
    // interpolated between anchors spaced ANCHOR_SEG*SEG_W apart (gentle slope),
    // while the gap narrows per block-segment as distance grows.
    function boundsAt(x) {
      var span = SEG_W * ANCHOR_SEG;
      var t = x / span;
      var i = Math.floor(t);
      var frac = t - i;
      var a = anchor(i);
      var b = anchor(i + 1);
      var v = a + (b - a) * smooth(frac);
      var center = CENTER_MIN + v * CENTER_SPAN;
      var gap = START_GAP - (x / SEG_W) * NARROW;
      if (gap < MIN_GAP) gap = MIN_GAP;
      var half = gap * 0.5;
      return { ceil: center - half, floor: center + half, center: center, gap: gap };
    }

    // The obstacle for segment k, or null. Deterministic from (seed, k). Each
    // obstacle exposes a `type` (for rendering) and one or more collision
    // rectangles `rects` (AABBs the boat hull must avoid).
    //   rock   : one rectangle jutting from the top OR bottom bank
    //   boat   : one small rectangle free-floating mid-channel (row around it)
    //   bridge : two pier rectangles (top + bottom) with a central arch gap
    function obstacleAt(k) {
      if (k < SAFE_SEG) return null;
      if (k % OBST_EVERY !== 0) return null;  // enforce spacing between obstacles
      if (hash01(seed, k, 1) >= OBST_PROB) return null;

      var segx = k * SEG_W;
      var bnd = boundsAt(segx + SEG_W * 0.5);
      var typeR = hash01(seed, k, 2);

      if (typeR < 0.55) {
        var top = hash01(seed, k, 3) < 0.5;
        var pen = bnd.gap * (0.22 + hash01(seed, k, 4) * 0.24);
        var rx = segx + hash01(seed, k, 5) * (SEG_W - ROCK_W);
        var rect = top
          ? { x: rx, w: ROCK_W, y0: bnd.ceil, y1: bnd.ceil + pen }
          : { x: rx, w: ROCK_W, y0: bnd.floor - pen, y1: bnd.floor };
        return { type: 'rock', top: top, rects: [rect] };
      }

      if (typeR < 0.8) {
        var lo = bnd.ceil + 20 + BOAT_OH * 0.5;
        var hi = bnd.floor - 20 - BOAT_OH * 0.5;
        if (hi <= lo) return null;
        var cy = lo + hash01(seed, k, 4) * (hi - lo);
        var bx = segx + hash01(seed, k, 5) * (SEG_W - BOAT_OW);
        return {
          type: 'boat', cx: bx + BOAT_OW * 0.5, cy: cy,
          rects: [{ x: bx, w: BOAT_OW, y0: cy - BOAT_OH * 0.5, y1: cy + BOAT_OH * 0.5 }]
        };
      }

      // bridge
      var gapH = 150 + hash01(seed, k, 4) * 26;
      if (gapH > bnd.gap - 24) gapH = bnd.gap - 24;
      if (gapH < 118) gapH = 118;
      var glo = bnd.ceil + gapH * 0.5 + 6;
      var ghi = bnd.floor - gapH * 0.5 - 6;
      var gc = ghi > glo ? glo + hash01(seed, k, 6) * (ghi - glo) : (bnd.ceil + bnd.floor) * 0.5;
      var px = segx + (SEG_W - BRIDGE_W) * 0.5;
      var gapTop = gc - gapH * 0.5, gapBot = gc + gapH * 0.5;
      return {
        type: 'bridge', gapTop: gapTop, gapBot: gapBot,
        rects: [
          { x: px, w: BRIDGE_W, y0: bnd.ceil - 60, y1: gapTop },
          { x: px, w: BRIDGE_W, y0: gapBot, y1: bnd.floor + 60 }
        ]
      };
    }

    // Obstacles whose x-span could touch a boat hull centered near world-x.
    function obstaclesNear(x) {
      var out = [];
      var k0 = Math.floor((x - BOAT_HW - SEG_W) / SEG_W);
      var k1 = Math.floor((x + BOAT_HW) / SEG_W);
      for (var k = k0; k <= k1; k++) {
        if (k < 0) continue;
        var o = obstacleAt(k);
        if (o) out.push(o);
      }
      return out;
    }

    // All obstacles with any part in [x0, x1] (for rendering).
    function obstaclesInRange(x0, x1) {
      var out = [];
      var k0 = Math.floor(x0 / SEG_W) - 1;
      var k1 = Math.floor(x1 / SEG_W) + 1;
      for (var k = k0; k <= k1; k++) {
        if (k < 0) continue;
        var o = obstacleAt(k);
        if (!o) continue;
        for (var i = 0; i < o.rects.length; i++) {
          if (o.rects[i].x + o.rects[i].w >= x0 && o.rects[i].x <= x1) { out.push(o); break; }
        }
      }
      return out;
    }

    return { boundsAt: boundsAt, obstaclesNear: obstaclesNear, obstaclesInRange: obstaclesInRange };
  }

  function makeState(seed) {
    var course = makeCourse(seed >>> 0);
    var start = course.boundsAt(0);
    return { tick: 0, x: 0, y: start.center, vy: 0, crashed: false, course: course };
  }

  // Advance exactly one fixed tick. `pressed` = oar held this tick.
  function step(state, pressed) {
    if (state.crashed) return state;

    var speed = SPEED0 + state.x * SPEED_RAMP;
    if (speed > SPEED_MAX) speed = SPEED_MAX;

    state.vy += pressed ? -LIFT : GRAV;
    if (state.vy > VY_MAX) state.vy = VY_MAX;
    else if (state.vy < -VY_MAX) state.vy = -VY_MAX;

    state.y += state.vy;
    state.x += speed;
    state.tick += 1;

    var b = state.course.boundsAt(state.x);
    if (state.y - BOAT_HH < b.ceil || state.y + BOAT_HH > b.floor) {
      state.crashed = true;
      return state;
    }
    var obs = state.course.obstaclesNear(state.x);
    for (var i = 0; i < obs.length; i++) {
      var rects = obs[i].rects;
      for (var j = 0; j < rects.length; j++) {
        var r = rects[j];
        if (state.x + BOAT_HW > r.x && state.x - BOAT_HW < r.x + r.w &&
            state.y + BOAT_HH > r.y0 && state.y - BOAT_HH < r.y1) {
          state.crashed = true;
          return state;
        }
      }
    }
    return state;
  }

  // Replay a run. `toggles` = ascending tick indices where the hold state flips
  // (starting from not-pressed). Returns authoritative { meters, ticks }.
  function simulate(seed, toggles, maxTicks) {
    var state = makeState(seed);
    toggles = toggles || [];
    var cap = maxTicks || MAX_TICKS;
    if (cap > MAX_TICKS) cap = MAX_TICKS;
    var pressed = false;
    var ti = 0;
    while (!state.crashed && state.tick < cap) {
      while (ti < toggles.length && toggles[ti] === state.tick) { pressed = !pressed; ti++; }
      step(state, pressed);
    }
    return { meters: Math.floor(state.x / UNITS_PER_METER), ticks: state.tick };
  }

  return {
    COURSE_VERSION: COURSE_VERSION,
    W: W, H: H, BOAT_X_FRAC: BOAT_X_FRAC, BOAT_HW: BOAT_HW, BOAT_HH: BOAT_HH,
    DT: DT, VY_MAX: VY_MAX, UNITS_PER_METER: UNITS_PER_METER, MAX_TICKS: MAX_TICKS,
    SEG_W: SEG_W,
    hash01: hash01,
    makeCourse: makeCourse,
    makeState: makeState,
    step: step,
    simulate: simulate
  };
});

    // Single shared backend for ALL environments (prod, staging, localhost) — one

    var PG_API = 'https://f0wrf1q42g.execute-api.us-east-1.amazonaws.com/prod';
    var PG_COUNTS_KEY = 'mn-swipe-counts';
    // Live per-photo totals keyed by "photo_<n>". Seeded instantly from the
    // last cached copy (no visible loading), then refreshed once per load.
    var PG_COUNTS = {};
    try { PG_COUNTS = JSON.parse(localStorage.getItem(PG_COUNTS_KEY) || '{}') || {}; } catch (e) { PG_COUNTS = {}; }

    function pgCount(photoNum) {
      var v = PG_COUNTS['photo_' + photoNum];
      return (typeof v === 'number' && isFinite(v)) ? v : 0;

    // Fetch all totals once per fresh load; non-blocking. On resolve, cache them

    function pgFetchCounts() {

          if (!data || typeof data !== 'object') return;
          PG_COUNTS = data;

          document.querySelectorAll('.photos-root').forEach(function (root) {

          });

        .catch(function () {});
    }

    // Fire-and-forget: record a swipe without blocking the UI or awaiting a
    // response. sendBeacon (text/plain = no CORS preflight) is ideal; fall back
    // to keepalive fetch.
    function pgPostSwipe(photoNum) {
      var url = PG_API + '/photo-swipe';
      var body = 'photo_' + photoNum;
      try {
        if (navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], { type: 'text/plain' }))) return;
      } catch (e) {}
      try { fetch(url, { method: 'POST', body: body, keepalive: true, mode: 'no-cors' }).catch(function () {}); } catch (e) {}
    }

    // Kick off the background fetch immediately (independent of the password
    // gate) so totals are ready well before the user reaches the Photos page.
    pgFetchCounts();

    // ===================== Rowing game =====================
    // Canvas engine for the "Row the Charles" game. Physics/collision come from
    // the shared window.GameSim (also run server-side to verify runs); everything
    // below is presentation + input recording + leaderboard I/O. All the boat
    // animation (oars, wake, tilt) is cosmetic and never feeds back into GameSim.
    var GAME_LB_KEY = 'mn-leaderboard';
    var GAME_NAME_KEY = 'mn-game-name';
    var GAME_BEST_KEY = 'mn-game-best';
    var gameCtls = [];
    var gameLB = [];
    try { gameLB = JSON.parse(localStorage.getItem(GAME_LB_KEY) || '[]') || []; } catch (e) { gameLB = []; }

    function initGame() {
      if (!window.GameSim) return;
      document.querySelectorAll('.game-root').forEach(function (root) {
        if (root._gameCtl) return;
        var ctl = setupGame(root);
        root._gameCtl = ctl;
        gameCtls.push(ctl);
      });
      renderAllBoards();
      gameFetchLeaderboard();
    }

    // Called on navigation into / out of the game page (see showSection hooks).
    function gameEnter() {
      gameFetchLeaderboard();
      gameCtls.forEach(function (c) { if (c.visible()) c.enter(); else c.leave(); });
    }
    function gameLeave() { gameCtls.forEach(function (c) { c.leave(); }); }

    function gameFetchLeaderboard() {
      fetch(PG_API + '/leaderboard', { cache: 'no-store' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (list) {
          if (!Array.isArray(list)) return;
          gameLB = list;
          try { localStorage.setItem(GAME_LB_KEY, JSON.stringify(list)); } catch (e) {}
          renderAllBoards();
        })
        .catch(function () {});
    }

    function renderAllBoards() {
      document.querySelectorAll('.game-root .lb-list').forEach(renderBoard);
    }
    function renderBoard(listEl) {
      if (!listEl) return;
      var myName = '';
      try { myName = (localStorage.getItem(GAME_NAME_KEY) || '').toLowerCase(); } catch (e) {}
      if (!gameLB.length) {
        listEl.innerHTML = '<li class="lb-empty">No scores yet &mdash; be the first!</li>';
        return;
      }
      var html = '';
      for (var i = 0; i < gameLB.length; i++) {
        var me = (myName && String(gameLB[i].name).toLowerCase() === myName) ? ' me' : '';
        html += '<li class="lb-row"><span class="lb-rank">' + (i + 1) +
          '</span><span class="lb-name' + me + '"></span>' +
          '<span class="lb-meters"><span class="lb-mv"></span><span class="unit">m</span></span></li>';
      }
      listEl.innerHTML = html;
      // Fill names via textContent (never innerHTML) so player names can't inject markup.
      var rows = listEl.querySelectorAll('.lb-row');
      for (var j = 0; j < rows.length; j++) {
        rows[j].querySelector('.lb-name').textContent = gameLB[j].name;
        rows[j].querySelector('.lb-mv').textContent = Number(gameLB[j].meters || 0).toLocaleString();
      }
    }

    function setupGame(root) {
      var G = window.GameSim;
      var W = G.W, H = G.H, BOAT_FRAC = G.BOAT_X_FRAC, UPM = G.UNITS_PER_METER;

      var canvas = root.querySelector('.game-canvas');
      var stage = root.querySelector('.game-stage');
      var hudM = root.querySelector('.game-hud-m');
      var startOv = root.querySelector('.game-start');
      var overOv = root.querySelector('.game-over');
      var startBtn = root.querySelector('.game-start-btn');
      var saveBtn = root.querySelector('.game-save-btn');
      var againBtn = root.querySelector('.game-again-btn');
      var nameInput = root.querySelector('.game-name');
      var bestEl = root.querySelector('.game-best');
      var overM = root.querySelector('.game-over-m');
      var overTitle = root.querySelector('.game-over-title');
      var msgEl = root.querySelector('.game-msg');

      var ctx = canvas.getContext('2d');
      var DPR = Math.min(window.devicePixelRatio || 1, 2);
      // Adaptive sizing: the canvas fills whatever size the stage is (large on
      // mobile). We always show the full channel height (H) and scale uniformly,
      // so there's no distortion; the visible world WIDTH grows/shrinks to fit.
      var viewW = W, viewH = H, scale = 1, visW = W;
      function resize() {
        var w = Math.max(1, Math.round(stage.clientWidth || W));
        var h = Math.max(1, Math.round(stage.clientHeight || H));
        viewW = w; viewH = h; scale = h / H; visW = w / scale;
        canvas.width = Math.round(w * DPR);
        canvas.height = Math.round(h * DPR);
      }
      resize();

      var state = null, seed = 0, pressed = false, lastPressed = false;
      var toggles = [], acc = 0, lastT = 0, raf = 0, running = false, playing = false;
      var finalMeters = 0, wake = [], idleX = 0, idleFrame = 0;
      var tiltDisp = 0, kick = 0;
      var submitting = false, submitted = false;
      var CRASH_TITLES = ['Caught a crab!', 'Into the reeds!', 'Beached it!', 'Splash!', 'Bank shot!'];

      function press(v) {
        if (v && !pressed) kick -= 0.16;   // little bow-up nod on each catch
        pressed = v;
      }

      function refreshBest() {
        var pb = 0; try { pb = parseInt(localStorage.getItem(GAME_BEST_KEY) || '0', 10) || 0; } catch (e) {}
        bestEl.textContent = pb > 0 ? ('Your best: ' + Number(pb).toLocaleString() + ' m') : '';
      }

      function enter() {
        playing = false;
        if (!state || state.crashed) state = G.makeState(2025); // gentle preview course
        overOv.classList.add('hidden');
        startOv.classList.remove('hidden');
        refreshBest();
        resize();
        idleX = 0; wake = []; tiltDisp = 0; kick = 0;
        ensureLoop();
      }
      function leave() {
        playing = false; running = false;
        if (raf) { cancelAnimationFrame(raf); raf = 0; }
      }

      function start() {
        seed = (Math.floor(Math.random() * 4294967296)) >>> 0;
        try { if (window.crypto && crypto.getRandomValues) { var a = new Uint32Array(1); crypto.getRandomValues(a); seed = a[0] >>> 0; } } catch (e) {}
        state = G.makeState(seed);
        pressed = false; lastPressed = false; toggles = [];
        acc = 0; wake = []; tiltDisp = 0; kick = 0; finalMeters = 0;
        playing = true;
        startOv.classList.add('hidden');
        overOv.classList.add('hidden');
        lastT = performance.now();
        ensureLoop();
      }

      function tickOnce() {
        if (pressed !== lastPressed) { toggles.push(state.tick); lastPressed = pressed; }
        G.step(state, pressed);
        wake.push({ wx: state.x - 26, wy: state.y + 2 });
        if (wake.length > 140) wake.shift();
      }

      function gameOver() {
        playing = false;
        finalMeters = Math.floor(state.x / UPM);
        overM.textContent = Number(finalMeters).toLocaleString();
        var pb = 0; try { pb = parseInt(localStorage.getItem(GAME_BEST_KEY) || '0', 10) || 0; } catch (e) {}
        if (finalMeters > pb) {
          try { localStorage.setItem(GAME_BEST_KEY, String(finalMeters)); } catch (e) {}
          overTitle.textContent = 'New personal best!';
        } else {
          overTitle.textContent = CRASH_TITLES[Math.floor(Math.random() * CRASH_TITLES.length)];
        }
        submitted = false; submitting = false;
        saveBtn.disabled = false; saveBtn.textContent = 'Save score'; msgEl.textContent = '';
        try { var n = localStorage.getItem(GAME_NAME_KEY); if (n && !nameInput.value) nameInput.value = n; } catch (e) {}
        overOv.classList.remove('hidden');
      }

      function submitScore() {
        if (submitting || submitted) return;
        var name = (nameInput.value || '').trim();
        if (!name) { msgEl.textContent = 'Enter a name to save.'; nameInput.focus(); return; }
        submitting = true; saveBtn.disabled = true; saveBtn.textContent = 'Saving\u2026'; msgEl.textContent = '';
        try { localStorage.setItem(GAME_NAME_KEY, name); } catch (e) {}
        fetch(PG_API + '/game-run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, seed: seed, inputTicks: toggles, clientMeters: finalMeters, courseVersion: G.COURSE_VERSION })
        }).then(function (r) {
          return r.json().catch(function () { return null; }).then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
        }).then(function (res) {
          submitting = false;
          if (res.ok && res.j) {
            submitted = true; saveBtn.textContent = 'Saved!';
            var m = Number(res.j.meters || 0);
            msgEl.textContent = res.j.best ? ('New best on the board \u2014 ' + m.toLocaleString() + ' m!') : ('Saved: ' + m.toLocaleString() + ' m');
            renderAllBoards();
            gameFetchLeaderboard();
          } else if (res.status === 409) {
            saveBtn.disabled = false; saveBtn.textContent = 'Save score';
            msgEl.textContent = 'Game was updated \u2014 please refresh the page.';
          } else {
            saveBtn.disabled = false; saveBtn.textContent = 'Save score';
            msgEl.textContent = 'Could not save. Try again.';
          }
        }).catch(function () {
          submitting = false; saveBtn.disabled = false; saveBtn.textContent = 'Save score';
          msgEl.textContent = 'Network error. Try again.';
        });
      }

      // ---------- loop ----------
      function ensureLoop() {
        if (running) return;
        running = true; lastT = performance.now();
        raf = requestAnimationFrame(loop);
      }
      function loop(t) {
        if (!running) return;
        var dt = (t - lastT) / 1000; lastT = t;
        if (dt > 0.1) dt = 0.1;
        if (playing) {
          acc += dt;
          var steps = 0;
          while (acc >= G.DT && steps < 6) {
            tickOnce(); acc -= G.DT; steps++;
            if (state.crashed) break;
          }
          if (state.crashed) { draw(); gameOver(); raf = requestAnimationFrame(loop); return; }
        } else {
          idleX += dt * 82; idleFrame += 1;
          wake.push({ wx: idleX - 26, wy: idleBoatY() + 2 });
          if (wake.length > 90) wake.shift();
        }
        draw();
        raf = requestAnimationFrame(loop);
      }

      function idleBoatY() {
        var c = state.course.boundsAt(idleX).center;
        return c + Math.sin(idleX * 0.018) * 12;
      }

      // ---------- drawing (all cosmetic; world-unit coordinate space) ----------
      // The canvas is transformed so 1 drawing unit == 1 world unit, scaled to
      // fill the stage height. `camLeftWorld` is the world-x at the left edge.
      function draw() {
        var boatWX, boatY, boatTick, vy;
        if (playing || (state && state.crashed)) {
          boatWX = state.x; boatY = state.y; boatTick = state.tick; vy = state.vy;
        } else {
          boatWX = idleX; boatY = idleBoatY(); boatTick = idleFrame; vy = Math.cos(idleX * 0.018) * 1.2;
        }
        var course = state.course;
        var s = scale;
        var camLeftWorld = boatWX - BOAT_FRAC * visW;
        ctx.setTransform(DPR * s, 0, 0, DPR * s, -camLeftWorld * DPR * s, 0);

        var x0 = camLeftWorld, x1 = camLeftWorld + visW;

        // water
        var wg = ctx.createLinearGradient(0, 0, 0, H);
        wg.addColorStop(0, '#dceff4'); wg.addColorStop(1, '#a9d4e0');
        ctx.fillStyle = wg; ctx.fillRect(x0 - 4, 0, visW + 8, H);
        // drifting ripple ticks
        ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 2;
        for (var ry = 40; ry < H; ry += 44) {
          var off = ((boatWX * 0.4 + ry * 3) % 64);
          ctx.beginPath();
          for (var rx = x0 - (x0 % 64) - 64 + off; rx < x1; rx += 64) { ctx.moveTo(rx, ry); ctx.lineTo(rx + 26, ry); }
          ctx.stroke();
        }

        drawBank(course, x0, x1, true);
        drawBank(course, x0, x1, false);

        var obs = course.obstaclesInRange(x0, x1);
        for (var i = 0; i < obs.length; i++) drawObstacle(obs[i]);

        drawWake();
        drawBoat(boatWX, boatY, boatTick, vy);

        if (playing) hudM.textContent = Math.floor(state.x / UPM).toLocaleString();
      }

      function drawBank(course, x0, x1, top) {
        var samp = visW / 90; if (samp < 6) samp = 6;
        var pts = [];
        for (var x = x0; x <= x1 + samp; x += samp) {
          var b = course.boundsAt(x);
          pts.push([x, top ? b.ceil : b.floor]);
        }
        ctx.beginPath();
        ctx.moveTo(x0 - 4, top ? 0 : H);
        for (var k = 0; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
        ctx.lineTo(x1 + samp, top ? 0 : H);
        ctx.closePath();
        ctx.fillStyle = top ? '#c9b98c' : '#c2b083';
        ctx.fill();
        ctx.beginPath();
        for (var m = 0; m < pts.length; m++) { if (m === 0) ctx.moveTo(pts[m][0], pts[m][1]); else ctx.lineTo(pts[m][0], pts[m][1]); }
        ctx.strokeStyle = '#8fae5f'; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();
      }

      function drawObstacle(o) {
        if (o.type === 'rock') drawRock(o);
        else if (o.type === 'boat') drawOtherBoat(o);
        else if (o.type === 'bridge') drawBridge(o);
      }

      function drawRock(o) {
        var r = o.rects[0];
        var w = r.w, h = r.y1 - r.y0, cx = r.x + w / 2, cy = (r.y0 + r.y1) / 2;
        ctx.fillStyle = '#8d8b86';
        roundRect(r.x, r.y0, w, h, 8); ctx.fill();
        ctx.strokeStyle = '#5f5d59'; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.beginPath(); ctx.ellipse(cx - w * 0.14, o.top ? r.y1 - h * 0.35 : r.y0 + h * 0.35, w * 0.24, h * 0.16, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.14)';
        ctx.beginPath(); ctx.ellipse(cx + w * 0.16, cy, w * 0.16, h * 0.22, 0, 0, Math.PI * 2); ctx.fill();
        // foam where the rock meets the water
        var tipY = o.top ? r.y1 : r.y0;
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(r.x - 3, tipY); ctx.lineTo(r.x + w + 3, tipY); ctx.stroke();
      }

      function drawOtherBoat(o) {
        var r = o.rects[0], w = r.w, h = r.y1 - r.y0;
        ctx.save();
        ctx.translate(o.cx, o.cy);
        // hull, pointed both ends (a passing shell, bow toward us at -x)
        ctx.fillStyle = '#3b5566';
        ctx.beginPath();
        ctx.moveTo(-w * 0.5, 0);
        ctx.quadraticCurveTo(-w * 0.18, -h * 0.5, w * 0.42, -h * 0.34);
        ctx.quadraticCurveTo(w * 0.52, 0, w * 0.42, h * 0.34);
        ctx.quadraticCurveTo(-w * 0.18, h * 0.5, -w * 0.5, 0);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#22343f'; ctx.lineWidth = 2; ctx.stroke();
        // two rowers
        ctx.fillStyle = '#d9b25a';
        ctx.beginPath(); ctx.ellipse(-w * 0.08, 0, 4.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(w * 0.12, 0, 4.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
        // static oars (both sides)
        ctx.strokeStyle = '#6b5a45'; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, -h * 0.34); ctx.lineTo(h * 0.5, -h); ctx.moveTo(0, h * 0.34); ctx.lineTo(h * 0.5, h);
        ctx.stroke();
        ctx.restore();
      }

      function drawBridge(o) {
        var r0 = o.rects[0], px = r0.x, w = r0.w;
        // faint shadow of the deck across the whole river
        ctx.fillStyle = 'rgba(60,50,40,0.10)';
        ctx.fillRect(px - 7, 0, w + 14, H);
        // stone piers (top + bottom) with mortar courses
        for (var i = 0; i < o.rects.length; i++) {
          var r = o.rects[i];
          var y0 = Math.max(r.y0, -4), y1 = Math.min(r.y1, H + 4);
          ctx.fillStyle = '#b8ab97'; ctx.fillRect(px, y0, w, y1 - y0);
          ctx.strokeStyle = '#7d7060'; ctx.lineWidth = 2; ctx.strokeRect(px, y0, w, y1 - y0);
          ctx.strokeStyle = 'rgba(90,80,66,0.5)'; ctx.lineWidth = 1.4;
          for (var yy = y0 + 12; yy < y1; yy += 14) { ctx.beginPath(); ctx.moveTo(px, yy); ctx.lineTo(px + w, yy); ctx.stroke(); }
        }
        // arch lips around the navigable opening
        ctx.strokeStyle = '#8a7c66'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px, o.gapTop); ctx.quadraticCurveTo(px + w / 2, o.gapTop - 11, px + w, o.gapTop);
        ctx.moveTo(px, o.gapBot); ctx.quadraticCurveTo(px + w / 2, o.gapBot + 11, px + w, o.gapBot);
        ctx.stroke();
      }

      function drawWake() {
        for (var i = 0; i < wake.length; i++) {
          var p = wake[i];
          var age = i / wake.length;              // 0 old .. 1 recent
          var r = 2 + age * 7;
          ctx.beginPath(); ctx.ellipse(p.wx, p.wy, r + 3, r, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + age * 0.26) + ')';
          ctx.fill();
        }
      }

      // Top-down single scull: pointed hull (bow at +x), a rower amidships, and
      // TWO sculling oars that sweep together. Heading noses toward the vertical
      // travel direction; a click adds a little dig/kick. Purely cosmetic.
      function drawBoat(bwx, by, tick, vy) {
        var target = vy * 0.055; if (target > 0.4) target = 0.4; else if (target < -0.4) target = -0.4;
        kick *= 0.85; target += kick;
        tiltDisp += (target - tiltDisp) * 0.22;

        var phase = tick * 0.16;
        var sweep = Math.sin(phase);            // +1 = blades swept to the stern (the drive)
        var drive = sweep > 0;

        var HL = 46, HW = 13, RIG = 28;         // hull half-length / half-width, rigger reach

        ctx.save();
        ctx.translate(bwx, by);
        ctx.rotate(tiltDisp);

        // oars first (under the hull), both sides together
        drawSculls(sweep, drive);

        // hull
        ctx.fillStyle = '#efe6d3';
        ctx.beginPath();
        ctx.moveTo(HL, 0);
        ctx.quadraticCurveTo(HL * 0.35, -HW, -HL * 0.5, -HW * 0.86);
        ctx.quadraticCurveTo(-HL, -HW * 0.4, -HL, 0);
        ctx.quadraticCurveTo(-HL, HW * 0.4, -HL * 0.5, HW * 0.86);
        ctx.quadraticCurveTo(HL * 0.35, HW, HL, 0);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#b7aa90'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.strokeStyle = 'rgba(150,120,80,0.45)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(-HL * 0.72, 0); ctx.lineTo(HL * 0.82, 0); ctx.stroke();

        // riggers (little struts out to the pins)
        ctx.strokeStyle = '#7a6d58'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-4, -HW * 0.4); ctx.lineTo(6, -13); ctx.moveTo(8, -HW * 0.4); ctx.lineTo(-2, -13);
        ctx.moveTo(-4, HW * 0.4); ctx.lineTo(6, 13); ctx.moveTo(8, HW * 0.4); ctx.lineTo(-2, 13);
        ctx.stroke();

        // rower (top-down: shoulders + head), slides sternward on the recovery
        var slide = -sweep * 5;
        ctx.save(); ctx.translate(slide, 0);
        ctx.fillStyle = '#c0431f';
        ctx.beginPath(); ctx.ellipse(0, 0, 9, 7.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e9c9a0';
        ctx.beginPath(); ctx.arc(4, 0, 4.6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        // bow wave on a hard catch (the "kick")
        if (kick < -0.03) {
          ctx.beginPath(); ctx.moveTo(HL + 2, -6); ctx.lineTo(HL + 12, 0); ctx.lineTo(HL + 2, 6);
          ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.stroke();
        }
        ctx.restore();
      }

      function drawSculls(sweep, drive) {
        var pin = 12;                     // pin offset from centerline (both sides)
        var reach = 30 + (drive ? 5 : -3);
        var bladeX = sweep * 20;          // fore/aft position of the blades (together)
        for (var side = -1; side <= 1; side += 2) {
          var pinY = side * pin;
          var bx = bladeX, byv = side * reach;
          ctx.strokeStyle = '#3a3128'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(0, pinY); ctx.lineTo(bx, byv); ctx.stroke();
          // blade (aligned with the shaft), orange as it bites on the drive
          ctx.save(); ctx.translate(bx, byv); ctx.rotate(Math.atan2(byv - pinY, bx));
          ctx.fillStyle = drive ? '#f3722b' : '#e9dcc0';
          roundRect(-2.5, -1.5, 13, 3, 1.5); ctx.fill();
          ctx.restore();
          if (drive) {
            ctx.beginPath(); ctx.ellipse(bx, byv, 5, 3.2, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
          }
        }
      }

      function roundRect(x, y, w, h, r) {
        if (h < 0) { y = y + h; h = -h; }
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      // ---------- input ----------
      stage.addEventListener('pointerdown', function (e) {
        if (!overOv.classList.contains('hidden')) return;         // game-over screen: use buttons
        if (e.target.closest('.game-btn, .game-name')) return;    // let controls handle themselves
        e.preventDefault();
        if (!startOv.classList.contains('hidden')) { start(); press(true); }
        else if (playing) { press(true); }
      });
      var release = function () { press(false); };
      stage.addEventListener('pointerup', release);
      stage.addEventListener('pointercancel', release);
      stage.addEventListener('pointerleave', release);

      document.addEventListener('keydown', function (e) {
        if (e.code !== 'Space' && e.key !== ' ') return;
        if (!visible() || !overOv.classList.contains('hidden')) return;
        e.preventDefault();
        if (!startOv.classList.contains('hidden')) { start(); press(true); }
        else if (playing) { press(true); }
      });

    function initSlideshow(root, count) {

    function initSwipe(root, count) {
      var stack = root.querySelector('.pg-swipe-stack');

      var N = count;
      // Show the "swipe us" hint on every fresh load/refresh. hintDone is
      // in-memory only (no persistence), so it hides once the user starts
      // swiping this session but returns next time the app is loaded.
      var hintEl = null, hintDone = false;
