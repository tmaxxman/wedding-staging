      CHEER_TEAMS.forEach(function (t) {
        t.imgs = t.srcs.map(function (s) { var im = new Image(); im.src = s; return im; });
      });

      function press(v) {
        if (v && !pressed) kick -= 0.16;   // little bow-up nod on each catch
        pressed = v;
      }

      function refreshBest() {
        var pb = 0; try { pb = parseInt(localStorage.getItem(GAME_BEST_KEY) || '0', 10) || 0; } catch (e) {}
        var txt = pb > 0 ? ('Your best: ' + Number(pb).toLocaleString() + ' m') : 'Your best: \u2014';
        root.querySelectorAll('.game-best').forEach(function (el) { el.textContent = txt; });
      }

      function enter() {
        playing = false;
        if (!state || state.crashed) state = G.makeState(2025); // gentle preview course
        overOv.classList.add('hidden');
        startOv.classList.remove('hidden');
        refreshBest();
        renderAllBoards();
        updateStartBtn();
        resize();
        idleX = 0; wake = []; tiltDisp = 0; kick = 0;
        ensureLoop();
      }
      function leave() {
        playing = false; running = false;
        if (immersive) exitImmersive();
        if (raf) { cancelAnimationFrame(raf); raf = 0; }
      }

      function start() {
        seed = (Math.floor(Math.random() * 4294967296)) >>> 0;
        try { if (window.crypto && crypto.getRandomValues) { var a = new Uint32Array(1); crypto.getRandomValues(a); seed = a[0] >>> 0; } } catch (e) {}
        state = G.makeState(seed);
        pressed = false; lastPressed = false; toggles = [];
        acc = 0; wake = []; tiltDisp = 0; kick = 0; finalMeters = 0;
        playing = true;
        startOv.classList.add('hidden');
        overOv.classList.add('hidden');
        lastT = performance.now();
        ensureLoop();
      }

      function tickOnce() {
        if (pressed !== lastPressed) { toggles.push(state.tick); lastPressed = pressed; }
        G.step(state, pressed);
        wake.push({ wx: state.x - 26, wy: state.y + 2 });
        if (wake.length > 140) wake.shift();
      }

      function gameOver() {
        playing = false;
        finalMeters = Math.floor(state.x / UPM);
        overM.textContent = Number(finalMeters).toLocaleString();
        var pb = 0; try { pb = parseInt(localStorage.getItem(GAME_BEST_KEY) || '0', 10) || 0; } catch (e) {}
        if (finalMeters > pb) {
          try { localStorage.setItem(GAME_BEST_KEY, String(finalMeters)); } catch (e) {}
          overTitle.textContent = 'New personal best!';
        } else {
          overTitle.textContent = CRASH_TITLES[Math.floor(Math.random() * CRASH_TITLES.length)];
        }
        submitted = false; submitting = false;
        saveBtn.disabled = false; saveBtn.textContent = 'Save score'; msgEl.textContent = '';
        try { var n = localStorage.getItem(GAME_NAME_KEY); if (n && !nameInput.value) nameInput.value = n; } catch (e) {}
        refreshBest();
        renderAllBoards();
        overOv.classList.remove('hidden');
      }

      function submitScore() {
        if (submitting || submitted) return;
        var name = (nameInput.value || '').trim();
        if (!name) { msgEl.textContent = 'Enter a name to save.'; nameInput.focus(); return; }
        submitting = true; saveBtn.disabled = true; saveBtn.textContent = 'Saving\u2026'; msgEl.textContent = '';
        try { localStorage.setItem(GAME_NAME_KEY, name); } catch (e) {}
        fetch(PG_API + '/game-run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, seed: seed, inputTicks: toggles, clientMeters: finalMeters, courseVersion: G.COURSE_VERSION })
        }).then(function (r) {
          return r.json().catch(function () { return null; }).then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
        }).then(function (res) {
          submitting = false;
          if (res.ok && res.j) {
            submitted = true; saveBtn.textContent = 'Saved!';
            var m = Number(res.j.meters || 0);
            msgEl.textContent = res.j.best ? ('New best on the board \u2014 ' + m.toLocaleString() + ' m!') : ('Saved: ' + m.toLocaleString() + ' m');
            renderAllBoards();
            gameFetchLeaderboard();
          } else if (res.status === 409) {
            saveBtn.disabled = false; saveBtn.textContent = 'Save score';
            msgEl.textContent = 'Game was updated \u2014 please refresh the page.';
          } else {
            saveBtn.disabled = false; saveBtn.textContent = 'Save score';
            msgEl.textContent = 'Could not save. Try again.';
          }
        }).catch(function () {
          submitting = false; saveBtn.disabled = false; saveBtn.textContent = 'Save score';
          msgEl.textContent = 'Network error. Try again.';
        });
      }

      // ---------- loop ----------
      function ensureLoop() {
        if (running) return;
        running = true; lastT = performance.now();
        raf = requestAnimationFrame(loop);
      }
      function loop(t) {
        if (!running) return;
        var dt = (t - lastT) / 1000; lastT = t;
        if (dt > 0.1) dt = 0.1;
        if (playing) {
          acc += dt;
          var steps = 0;
          while (acc >= G.DT && steps < 6) {
            tickOnce(); acc -= G.DT; steps++;
            if (state.crashed) break;
          }
          if (state.crashed) { draw(); gameOver(); raf = requestAnimationFrame(loop); return; }
        } else {
          idleX += dt * 82; idleFrame += 1;
          wake.push({ wx: idleX - 26, wy: idleBoatY() + 2 });
          if (wake.length > 90) wake.shift();
        }
        draw();
        raf = requestAnimationFrame(loop);
      }

      function idleBoatY() {
        var c = state.course.boundsAt(idleX).center;
        return c + Math.sin(idleX * 0.018) * 12;
      }

      // ---------- drawing (all cosmetic; world-unit coordinate space) ----------
      // The canvas is transformed so 1 drawing unit == 1 world unit, scaled to
      // fill the stage height. `camLeftWorld` is the world-x at the left edge.
      function draw() {
        var boatWX, boatY, boatTick, vy;
        if (playing || (state && state.crashed)) {
          boatWX = state.x; boatY = state.y; boatTick = state.tick; vy = state.vy;
        } else {
          boatWX = idleX; boatY = idleBoatY(); boatTick = idleFrame; vy = Math.cos(idleX * 0.018) * 1.2;
        }
        var course = state.course;
        var s = scale;
        var camLeftWorld = boatWX - BOAT_FRAC * visW;
        ctx.setTransform(DPR * s, 0, 0, DPR * s, -camLeftWorld * DPR * s, 0);

        var x0 = camLeftWorld, x1 = camLeftWorld + visW;

        // water
        var wg = ctx.createLinearGradient(0, 0, 0, H);
        wg.addColorStop(0, '#dceff4'); wg.addColorStop(1, '#a9d4e0');
        ctx.fillStyle = wg; ctx.fillRect(x0 - 4, 0, visW + 8, H);
        // drifting ripple ticks
        ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 2;
        for (var ry = 40; ry < H; ry += 44) {
          var off = ((boatWX * 0.4 + ry * 3) % 64);
          ctx.beginPath();
          for (var rx = x0 - (x0 % 64) - 64 + off; rx < x1; rx += 64) { ctx.moveTo(rx, ry); ctx.lineTo(rx + 26, ry); }
          ctx.stroke();
        }

        drawBank(course, x0, x1, true);
        drawBank(course, x0, x1, false);

        var obs = course.obstaclesInRange(x0, x1);
        for (var i = 0; i < obs.length; i++) drawObstacle(obs[i]);

        drawCheerers(course, x0, x1);

        drawWake();
        drawBoat(boatWX, boatY, boatTick, vy);

        if (playing) hudM.textContent = Math.floor(state.x / UPM).toLocaleString();
      }

      function drawBank(course, x0, x1, top) {
        var samp = visW / 90; if (samp < 6) samp = 6;
        var pts = [];
        for (var x = x0; x <= x1 + samp; x += samp) {
          var b = course.boundsAt(x);
          pts.push([x, top ? b.ceil : b.floor]);
        }
        ctx.beginPath();
        ctx.moveTo(x0 - 4, top ? 0 : H);
        for (var k = 0; k < pts.length; k++) ctx.lineTo(pts[k][0], pts[k][1]);
        ctx.lineTo(x1 + samp, top ? 0 : H);
        ctx.closePath();
        ctx.fillStyle = top ? '#c9b98c' : '#c2b083';
        ctx.fill();
        ctx.beginPath();
        for (var m = 0; m < pts.length; m++) { if (m === 0) ctx.moveTo(pts[m][0], pts[m][1]); else ctx.lineTo(pts[m][0], pts[m][1]); }
        ctx.strokeStyle = '#8fae5f'; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke();
      }

      function drawObstacle(o) {
        if (o.type === 'rock') drawRock(o);
        else if (o.type === 'boat') drawOtherBoat(o);
        else if (o.type === 'bridge') drawBridge(o);
      }

      function drawRock(o) {
        var r = o.rects[0];
        var w = r.w, h = r.y1 - r.y0, cx = r.x + w / 2, cy = (r.y0 + r.y1) / 2;
        ctx.fillStyle = '#8d8b86';
        roundRect(r.x, r.y0, w, h, 8); ctx.fill();
        ctx.strokeStyle = '#5f5d59'; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.beginPath(); ctx.ellipse(cx - w * 0.14, o.top ? r.y1 - h * 0.35 : r.y0 + h * 0.35, w * 0.24, h * 0.16, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.14)';
        ctx.beginPath(); ctx.ellipse(cx + w * 0.16, cy, w * 0.16, h * 0.22, 0, 0, Math.PI * 2); ctx.fill();
        // foam where the rock meets the water
        var tipY = o.top ? r.y1 : r.y0;
        ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(r.x - 3, tipY); ctx.lineTo(r.x + w + 3, tipY); ctx.stroke();
      }

      function drawOtherBoat(o) {
        var r = o.rects[0], w = r.w, h = r.y1 - r.y0;
        ctx.save();
        ctx.translate(o.cx, o.cy);
        // hull, pointed both ends (a passing shell, bow toward us at -x)
        ctx.fillStyle = '#3b5566';
        ctx.beginPath();
        ctx.moveTo(-w * 0.5, 0);
        ctx.quadraticCurveTo(-w * 0.18, -h * 0.5, w * 0.42, -h * 0.34);
        ctx.quadraticCurveTo(w * 0.52, 0, w * 0.42, h * 0.34);
        ctx.quadraticCurveTo(-w * 0.18, h * 0.5, -w * 0.5, 0);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#22343f'; ctx.lineWidth = 2; ctx.stroke();
        // two rowers
        ctx.fillStyle = '#d9b25a';
        ctx.beginPath(); ctx.ellipse(-w * 0.08, 0, 4.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(w * 0.12, 0, 4.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
        // static oars (both sides)
        ctx.strokeStyle = '#6b5a45'; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, -h * 0.34); ctx.lineTo(h * 0.5, -h); ctx.moveTo(0, h * 0.34); ctx.lineTo(h * 0.5, h);
        ctx.stroke();
        ctx.restore();
      }

      function drawBridge(o) {
        var r0 = o.rects[0], px = r0.x, w = r0.w;
        // faint shadow of the deck across the whole river
        ctx.fillStyle = 'rgba(60,50,40,0.10)';
        ctx.fillRect(px - 7, 0, w + 14, H);
        // stone piers (top + bottom) with mortar courses
        for (var i = 0; i < o.rects.length; i++) {
          var r = o.rects[i];
          var y0 = Math.max(r.y0, -4), y1 = Math.min(r.y1, H + 4);
          ctx.fillStyle = '#b8ab97'; ctx.fillRect(px, y0, w, y1 - y0);
          ctx.strokeStyle = '#7d7060'; ctx.lineWidth = 2; ctx.strokeRect(px, y0, w, y1 - y0);
          ctx.strokeStyle = 'rgba(90,80,66,0.5)'; ctx.lineWidth = 1.4;
          for (var yy = y0 + 12; yy < y1; yy += 14) { ctx.beginPath(); ctx.moveTo(px, yy); ctx.lineTo(px + w, yy); ctx.stroke(); }
        }
        // arch lips around the navigable opening
        ctx.strokeStyle = '#8a7c66'; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(px, o.gapTop); ctx.quadraticCurveTo(px + w / 2, o.gapTop - 11, px + w, o.gapTop);
        ctx.moveTo(px, o.gapBot); ctx.quadraticCurveTo(px + w / 2, o.gapBot + 11, px + w, o.gapBot);
        ctx.stroke();
      }

      function drawWake() {
        for (var i = 0; i < wake.length; i++) {
          var p = wake[i];
          var age = i / wake.length;              // 0 old .. 1 recent
          var r = 2 + age * 7;
          ctx.beginPath(); ctx.ellipse(p.wx, p.wy, r + 3, r, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + age * 0.26) + ')';
          ctx.fill();
        }
      }

      // Bank cheerers at each 500m mark. Deterministic per (seed, markIndex):
      // which person, which bank, exact spot. Sized to fit the available bank so
      // the figure + speech bubble never run off the top/bottom of the stage.
      function drawCheerers(course, x0, x1) {
        var stepU = CHEER_EVERY_M * UPM;               // world units between marks
        var n0 = Math.max(1, Math.floor(x0 / stepU));
        var n1 = Math.floor((x1 + stepU) / stepU);
        // No two marks in a row share a team. With two teams this alternates; the
        // random per-run start bit decides which team leads. Face within the team
        // is chosen at random per mark so the specific person's photo cycles.
        var startBit = G.hash01(seed, 0, 11) < 0.5 ? 0 : 1;
        for (var n = n0; n <= n1; n++) {
          var wx = n * stepU;
          if (wx < x0 - 40 || wx > x1 + 40) continue;
          var team = CHEER_TEAMS[(n + startBit) & 1];
          if (!team.imgs.length) continue;
          var img = team.imgs[Math.floor(G.hash01(seed, n, 12) * team.imgs.length) % team.imgs.length];
          if (!img || !img.complete || !img.naturalWidth) continue;
          var who = { img: img, text: team.text, accent: team.accent };
          var b = course.boundsAt(wx);
          var roomTop = b.ceil, roomBot = H - b.floor;
          var top = roomTop >= roomBot;
          var avail = top ? roomTop : roomBot;
          if (avail < 46) continue;                    // no room on the roomier bank
          // Reserve ~20% headroom so the jump (below) never pushes the bubble off
          // the top edge on a tight bank.
          var total = Math.min((avail - 6) / 1.22, 104); // whole figure incl. bubble
          var bubbleH = total * 0.24, figH = total - bubbleH - 4;
          var jitter = (G.hash01(seed, n, 9) - 0.5) * 16; // small along-shore wiggle
          // Always upright (head up). Feet plant in that bank's grass: at the top
          // shoreline (ceil) up top, or just inside the bottom grass (floor+figH).
          var feetY = top ? b.ceil : (b.floor + figH);
          drawCheerFigure(wx + jitter, feetY, -1, total, who, n);
        }
      }

      function drawCheerFigure(cx, feetY, dir, total, who, n) {
        var bubbleH = total * 0.24;
        var figH = total - bubbleH - 4;
        var headD = figH * 0.44;
        var stroke = Math.max(2, figH * 0.05);
        var t = (typeof performance !== 'undefined' ? performance.now() : Date.now());
        var wave = Math.sin(t / 220 + n) * figH * 0.10;   // cosmetic arm wave
        // Excited hop: the whole figure springs up and down. Rectified sine so it
        // only ever rises off the bank (never sinks below it); per-figure phase so
        // the crowd isn't in lockstep. dir<0 means up-screen.
        var hop = Math.abs(Math.sin(t / 240 + n * 1.7)) * figH * 0.26;
        feetY += dir * hop;

        var hipY = feetY + dir * (figH * 0.30);
        var shoulderY = hipY + dir * (figH * 0.32);
        var headCY = shoulderY + dir * (headD * 0.60);

        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.strokeStyle = '#2b2a28'; ctx.lineWidth = stroke;
        // legs
        ctx.beginPath();
        ctx.moveTo(cx, hipY); ctx.lineTo(cx - figH * 0.11, feetY);
        ctx.moveTo(cx, hipY); ctx.lineTo(cx + figH * 0.11, feetY);
        // torso
        ctx.moveTo(cx, hipY); ctx.lineTo(cx, shoulderY);
        // arms raised in a cheer (one waves)
        ctx.moveTo(cx, shoulderY); ctx.lineTo(cx - figH * 0.24, shoulderY + dir * (figH * 0.34));
        ctx.moveTo(cx, shoulderY); ctx.lineTo(cx + figH * 0.24, shoulderY + dir * (figH * 0.34) + wave);
        ctx.stroke();

        // head photo
        ctx.drawImage(who.img, cx - headD / 2, headCY - headD / 2, headD, headD);

        // speech bubble just outward of the head (over the bank), tail to head
        ctx.font = '700 ' + (bubbleH * 0.52).toFixed(1) + 'px "Helvetica Neue", Arial, sans-serif';
        var tw = ctx.measureText(who.text).width;
        var padX = bubbleH * 0.42;
        var bw = tw + padX * 2, bh = bubbleH;
        var bcy = headCY + dir * (headD * 0.55 + bh * 0.62);
        var bx = cx - bw / 2, by = bcy - bh / 2;
        // tail
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(cx - bh * 0.18, by + (dir < 0 ? bh : 0));
        ctx.lineTo(cx, headCY + dir * headD * 0.42);
        ctx.lineTo(cx + bh * 0.18, by + (dir < 0 ? bh : 0));
        ctx.closePath(); ctx.fill();
        // rounded body
        roundRect(bx, by, bw, bh, bh * 0.32);
        ctx.fillStyle = '#fff'; ctx.fill();
        ctx.strokeStyle = who.accent; ctx.lineWidth = Math.max(1.5, bubbleH * 0.08); ctx.stroke();
        ctx.fillStyle = who.accent;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(who.text, cx, bcy + bh * 0.04);
        ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
      }

      // Top-down single scull: pointed hull (bow at +x), a rower amidships, and
      // TWO sculling oars that sweep together. Heading noses toward the vertical
      // travel direction; a click adds a little dig/kick. Purely cosmetic.
      function drawBoat(bwx, by, tick, vy) {
        var target = vy * 0.055; if (target > 0.4) target = 0.4; else if (target < -0.4) target = -0.4;
        kick *= 0.85; target += kick;
        tiltDisp += (target - tiltDisp) * 0.22;

        var phase = tick * 0.16;
        var sweep = Math.sin(phase);            // +1 = blades swept to the stern (the drive)
        var drive = sweep > 0;

        var HL = 58, HW = 8, RIG = 28;          // hull half-length / half-width, rigger reach
        // A racing single is very long & very skinny: HL/HW ~ 7:1 needle here.

        ctx.save();
        ctx.translate(bwx, by);
        ctx.rotate(tiltDisp);

        // oars first (under the hull), both sides together
        drawSculls(sweep, drive);

        // hull -- long symmetric needle: identical taper to sharp bow & stern,
        // widest amidships (a scull's hull is fore/aft symmetric).
        ctx.fillStyle = '#f3ecdd';
        ctx.beginPath();
        ctx.moveTo(HL, 0);
        ctx.quadraticCurveTo(HL * 0.45, -HW, 0, -HW);
        ctx.quadraticCurveTo(-HL * 0.45, -HW, -HL, 0);
        ctx.quadraticCurveTo(-HL * 0.45, HW, 0, HW);
        ctx.quadraticCurveTo(HL * 0.45, HW, HL, 0);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#b7aa90'; ctx.lineWidth = 1.3; ctx.stroke();
        // keel/centerline
        ctx.strokeStyle = 'rgba(150,120,80,0.45)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(-HL * 0.82, 0); ctx.lineTo(HL * 0.82, 0); ctx.stroke();
        // livery chevrons near the bow (like the photo)
        ctx.strokeStyle = 'rgba(40,52,80,0.75)'; ctx.lineWidth = 1.6; ctx.lineJoin = 'round';
        for (var cv = 0; cv < 2; cv++) {
          var cx = HL * 0.5 + cv * 7;
          ctx.beginPath();
          ctx.moveTo(cx - 3, -HW * 0.62); ctx.lineTo(cx + 2, 0); ctx.lineTo(cx - 3, HW * 0.62);
          ctx.stroke();
        }

        // riggers (little struts out to the pins at +/-12)
        ctx.strokeStyle = '#7a6d58'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(-3, -HW * 0.4); ctx.lineTo(5, -12); ctx.moveTo(7, -HW * 0.4); ctx.lineTo(-1, -12);
        ctx.moveTo(-3, HW * 0.4); ctx.lineTo(5, 12); ctx.moveTo(7, HW * 0.4); ctx.lineTo(-1, 12);
        ctx.stroke();

        // rower (top-down): scullers FACE THE STERN, so the head sits toward the
        // stern (-x) with the back/shoulders toward the bow. Slides on the recovery.
        var slide = -sweep * 5;
        ctx.save(); ctx.translate(slide, 0);
        ctx.fillStyle = '#c0431f';
        ctx.beginPath(); ctx.ellipse(0, 0, 8, 7.5, 0, 0, Math.PI * 2); ctx.fill();   // back/shoulders
        ctx.fillStyle = '#e9c9a0';
        ctx.beginPath(); ctx.arc(-7, 0, 4.6, 0, Math.PI * 2); ctx.fill();             // head toward stern
        ctx.restore();

        // bow wave on a hard catch (the "kick")
        if (kick < -0.03) {
          ctx.beginPath(); ctx.moveTo(HL + 2, -6); ctx.lineTo(HL + 12, 0); ctx.lineTo(HL + 2, 6);
          ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.stroke();
        }
        ctx.restore();
      }

      function drawSculls(sweep, drive) {
        var pin = 12;                     // pin offset from centerline (both sides)
        var reach = 30 + (drive ? 5 : -3);
        var bladeX = sweep * 20;          // fore/aft position of the blades (together)
        for (var side = -1; side <= 1; side += 2) {
          var pinY = side * pin;
          var bx = bladeX, byv = side * reach;
          ctx.strokeStyle = '#3a3128'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(0, pinY); ctx.lineTo(bx, byv); ctx.stroke();
          // blade (aligned with the shaft), orange as it bites on the drive
          ctx.save(); ctx.translate(bx, byv); ctx.rotate(Math.atan2(byv - pinY, bx));
          ctx.fillStyle = drive ? '#f3722b' : '#e9dcc0';
          roundRect(-2.5, -1.5, 13, 3, 1.5); ctx.fill();
          ctx.restore();
          if (drive) {
            ctx.beginPath(); ctx.ellipse(bx, byv, 5, 3.2, 0, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
          }
        }
      }

      function roundRect(x, y, w, h, r) {
        if (h < 0) { y = y + h; h = -h; }
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      // ---------- fullscreen / landscape (mobile) ----------
      // iOS Safari can't truly fullscreen a <div> or lock orientation, so we use
      // a faux-fullscreen fixed overlay and, when the phone is held in portrait,
      // rotate the game 90deg so it plays across the phone's long edge (wide view
      // = much more lookahead, matching the desktop feel). We still request native
      // fullscreen + orientation lock where supported (Android/desktop) as a bonus.
      var immersive = false, hadNativeFs = false;
      var fsSlot = null, fsParent = null, savedScrollY = 0;
      function isPortrait() { return window.innerHeight > window.innerWidth; }

      // Portal the stage out to <body> so its fixed positioning is relative to the
      // viewport (not confined by the scrollable mobile container / any ancestor
      // transform). This is what makes ONLY the game go fullscreen.
      function portalOut() {
        if (fsSlot) return;
        fsParent = stage.parentNode;
        fsSlot = document.createComment('game-stage-slot');
        fsParent.insertBefore(fsSlot, stage);
        document.body.appendChild(stage);
      }
      function portalBack() {
        if (!fsSlot) return;
        fsParent.insertBefore(stage, fsSlot);
        fsSlot.remove(); fsSlot = null; fsParent = null;
      }
      function lockScroll() {
        savedScrollY = window.scrollY || window.pageYOffset || 0;
        document.documentElement.classList.add('game-noscroll');
        document.body.classList.add('game-noscroll');
      }
      function unlockScroll() {
        document.documentElement.classList.remove('game-noscroll');
        document.body.classList.remove('game-noscroll');
        try { window.scrollTo(0, savedScrollY); } catch (e) {}
      }

      function applyImmersiveLayout() {
        if (!immersive) {
          stage.classList.remove('is-immersive', 'is-rotated');
          if (rotateHint) rotateHint.classList.add('hidden');
        } else {
          stage.classList.add('is-immersive');
          var portrait = isPortrait();
          stage.classList.toggle('is-rotated', portrait);
          if (rotateHint) rotateHint.classList.toggle('hidden', !portrait);
        }
        resize(); draw();
      }
      function enterImmersive() {
        immersive = true;
        if (fsBtn) fsBtn.textContent = '\u2715 Exit';
        portalOut();
        lockScroll();
        applyImmersiveLayout();
        try {
          var req = stage.requestFullscreen || stage.webkitRequestFullscreen;
          if (req) { var p = req.call(stage); if (p && p.catch) p.catch(function () {}); }
        } catch (e) {}
        try {
          if (screen.orientation && screen.orientation.lock) {
            var q = screen.orientation.lock('landscape'); if (q && q.catch) q.catch(function () {});
          }
        } catch (e) {}
        updateStartBtn();
      }
      function exitImmersive() {
        immersive = false; hadNativeFs = false;
        if (fsBtn) fsBtn.textContent = '\u2922 Fullscreen';
        try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
        try {
          var exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit && (document.fullscreenElement || document.webkitFullscreenElement)) exit.call(document);
        } catch (e) {}
        stage.classList.remove('is-immersive', 'is-rotated');
        if (rotateHint) rotateHint.classList.add('hidden');
        unlockScroll();
        portalBack();
        resize(); draw();
        updateStartBtn();
      }
      function toggleImmersive() { if (immersive) exitImmersive(); else enterImmersive(); }
      if (fsBtn) fsBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleImmersive(); });
      window.addEventListener('orientationchange', function () { if (immersive) setTimeout(applyImmersiveLayout, 80); });
      document.addEventListener('fullscreenchange', function () {
        var active = !!(document.fullscreenElement || document.webkitFullscreenElement);
        if (active) hadNativeFs = true;
        else if (hadNativeFs && immersive) exitImmersive();  // user exited native FS (e.g. Android back)
      });

    // Masonry that packs each thumbnail into the currently-shortest column.
    // CSS multi-column balancing differs on iOS Safari (leaves an uneven tail),
    // so we distribute in JS for a consistent "brick wall" ending everywhere.
    function layoutMasonry(root, cols) {
      var grid = root.querySelector('.pg-grid');
      if (!grid) return;
      var cells = Array.prototype.slice.call(grid.querySelectorAll('.pg-cell'));
      if (!cells.length) return;
      cells.sort(function (a, b) {
        return (+a.getAttribute('data-idx')) - (+b.getAttribute('data-idx'));
      });

      function distribute(useRatios) {
        var columns = [], heights = [];
        grid.innerHTML = '';
        for (var i = 0; i < cols; i++) {
          var col = document.createElement('div');
          col.className = 'pg-col';
          grid.appendChild(col);
          columns.push(col); heights.push(0);
        }
        cells.forEach(function (cell) {
          var min = 0;
          for (var j = 1; j < cols; j++) { if (heights[j] < heights[min]) min = j; }
          columns[min].appendChild(cell);
          var im = cell.querySelector('img'), r = 1;
          if (useRatios && im && im.naturalWidth) r = im.naturalHeight / im.naturalWidth;
          heights[min] += r;
        });
      }

      // Instant even-count layout, then re-balance by real aspect ratios on load.
      distribute(false);
      var imgs = cells.map(function (c) { return c.querySelector('img'); });
      var pending = imgs.length, settled = false;
      function finalize() { if (settled) return; settled = true; distribute(true); }
      imgs.forEach(function (im) {
        if (im.complete && im.naturalWidth) { if (--pending === 0) finalize(); }
        else {
          var on = function () {
            im.removeEventListener('load', on); im.removeEventListener('error', on);
            if (--pending === 0) finalize();
          };
          im.addEventListener('load', on); im.addEventListener('error', on);
        }
      });
      setTimeout(finalize, 2000);
    }

    // Countdown to New Year's — Dec 31, 2026, 00:00 ET (UTC-5).
    // Updates every [data-cd] element (the hero appears in both the desktop
    // and mobile shells, so there can be two instances of each unit).
    function startCountdown() {
      const TARGET = new Date('2026-12-31T00:00:00-05:00').getTime();
      const pad = n => String(n).padStart(2, '0');
      const setAll = (unit, value) => {
        document.querySelectorAll('[data-cd="' + unit + '"]').forEach(el => {
          el.textContent = value;
        });
      };

      function updateCountdown() {
        let diff = Math.max(0, TARGET - Date.now());
        const days = Math.floor(diff / 86400000); diff -= days * 86400000;
        const hours = Math.floor(diff / 3600000); diff -= hours * 3600000;
        const mins = Math.floor(diff / 60000); diff -= mins * 60000;
        const secs = Math.floor(diff / 1000);
        setAll('days', String(days));
        setAll('hours', pad(hours));
        setAll('mins', pad(mins));
        setAll('secs', pad(secs));
      }

      // Update immediately and then every second
      updateCountdown();
      setInterval(updateCountdown, 1000);
    }

    // Split a content.json date ("Wednesday, December 30, 2026") into
    // { dow: "Wed", md: "Dec 30" } for the schedule "when" column.
    function formatWhen(dateStr) {
      if (!dateStr) return { dow: '', md: '' };
      const MONTHS = {
        January: 'Jan', February: 'Feb', March: 'Mar', April: 'Apr',
        May: 'May', June: 'Jun', July: 'Jul', August: 'Aug',
        September: 'Sep', October: 'Oct', November: 'Nov', December: 'Dec'
      };
      const m = dateStr.match(/^\s*([A-Za-z]+),\s*([A-Za-z]+)\s+(\d+)/);
      if (!m) return { dow: dateStr, md: '' };
      return {
        dow: m[1].slice(0, 3),
        md: (MONTHS[m[2]] || m[2].slice(0, 3)) + ' ' + m[3]
      };
    }

        return '/wedding';
      }
      return '';
    }

    // Bouncing question mark screensaver
    let bouncerX = 100, bouncerY = 100;
    let bouncerDX = 1.2, bouncerDY = 0.9;
    let bouncerAnimationId = null;
    
    function animateBouncer() {
      const bouncer = document.getElementById('qaBouncer');
      
      if (!bouncer) {
        bouncerAnimationId = requestAnimationFrame(animateBouncer);
        return;
      }
      
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const bouncerWidth = 60;
      const bouncerHeight = 60;
      
      bouncerX += bouncerDX;
      bouncerY += bouncerDY;
      
      // Bounce off edges - use screen dimensions
      if (bouncerX <= 0) {
        bouncerDX = Math.abs(bouncerDX);
        bouncerX = 0;
      } else if (bouncerX + bouncerWidth >= screenWidth) {
        bouncerDX = -Math.abs(bouncerDX);
        bouncerX = screenWidth - bouncerWidth;
      }
      
      if (bouncerY <= 0) {
        bouncerDY = Math.abs(bouncerDY);
        bouncerY = 0;
      } else if (bouncerY + bouncerHeight >= screenHeight) {
        bouncerDY = -Math.abs(bouncerDY);
        bouncerY = screenHeight - bouncerHeight;
      }
      
      bouncer.style.left = bouncerX + 'px';
      bouncer.style.top = bouncerY + 'px';
      
      bouncerAnimationId = requestAnimationFrame(animateBouncer);
    }
    
    // Start bouncer when Q+A section is shown
    function startBouncer() {
      if (!bouncerAnimationId) {
        // Reset position to center-ish
        bouncerX = window.innerWidth / 3;
        bouncerY = window.innerHeight / 3;
        bouncerAnimationId = requestAnimationFrame(animateBouncer);
      }
    }
    
    function stopBouncer() {
      if (bouncerAnimationId) {
        cancelAnimationFrame(bouncerAnimationId);
        bouncerAnimationId = null;
      }
    }
    
    // ===================== RSVP flow =====================
    // Ported from rsvp-8C.html. #section-rsvp is duplicated across the desktop
    // and mobile shells, so we initialize each .rsvp-root independently and
    // scope every query to that root. The mock party below stands in until the
    // Google Sheet lookup/submit is wired: replace rsvpLookupParty (pull the
    // party by name from the sheet) and rsvpSubmit (POST answers to the sheet).
    var RSVP_MEALS = ['Beef', 'Fish', 'Vegetarian'];
    // [1] Mock guest list — swap for the Google Sheet lookup. Keys are
    // "firstname lastname" lowercased; every guest maps to the same party.
    // A guest entry is either a fixed name (string) or a plus-one placeholder
    // ({ plusOne: true }) whose First/Last name the party fills in on the
    // wedding RSVP.
    var RSVP_PARTIES = [
      { name: 'Meghan Wheeler & Nolan Pollock', guests: ['Meghan Wheeler', 'Nolan Pollock'], rehearsal: true },
      // Sara has a plus-one: the guest's name is entered on the wedding RSVP
      // (required) and flows through to the rehearsal dinner page.
      { name: 'Sara Kovel', guests: ['Sara Kovel', { plusOne: true }], rehearsal: true },
      // Wedding-only party — the night before is close family, so no rehearsal.
      { name: 'Alex Spaulding & Andrew Reed', guests: ['Alex Spaulding', 'Andrew Reed'], rehearsal: false }
    ];
    var RSVP_GUESTS = {};
    RSVP_PARTIES.forEach(function (p) {
      p.guests.forEach(function (g) {
        if (typeof g !== 'string') return; // plus-one has no fixed name to look up
        RSVP_GUESTS[g.toLowerCase().replace(/\s+/g, ' ').trim()] = p;
      });
    });

    // [1] Swap for a real request. Return a party object or null.
    function rsvpLookupParty(first, last) {
      var key = (first + ' ' + last).toLowerCase().replace(/\s+/g, ' ').trim();
      return RSVP_GUESTS[key] || null;
    }
    // [2] Real POST to the Google Apps Script Web App backing the RSVP sheet.
    // The token is a shared secret checked server-side to deter spam writes; it
    // is not a real credential (this is a static site) and grants no read access
    // to the sheet. Payload is guest-centric — see finish() for the shape.
    var RSVP_ENDPOINT = 'https://script.google.com/macros/s/AKfycbz5_C6Ss8KqynX-ex47oHy6uI_Q8XSDuJoKQekmwWMPBa5PaF2J4EVK1o-ECAF33k6_/exec';
    var RSVP_TOKEN = '05956cd91e42146cf4a3bd35444b32d93bbf58e71e368eb1';
    function rsvpSubmit(payload) {
      payload.token = RSVP_TOKEN;
      // text/plain keeps this a "simple" CORS request (no preflight, which Apps
      // Script can't answer); the script still reads the raw JSON body. Apps
      // Script's final response includes Access-Control-Allow-Origin: * so we
      // can read {ok:true} back and only confirm once the row actually saves.
      return fetch(RSVP_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload),
        redirect: 'follow'
      }).then(function (r) {
        return r.json().catch(function () { return null; });
      }).then(function (data) {
        if (!data || data.ok !== true) throw new Error((data && data.error) || 'save-failed');
        return data;
      });
    }

    function initRsvp() {
      document.querySelectorAll('.rsvp-root').forEach(function (root) {
        if (root._rsvpInit) return;
        root._rsvpInit = true;
        setupRsvp(root);
      });
    }

    function setupRsvp(root) {
      var state = { party: null, guestList: [], wedding: {}, rehearsal: {}, welcome: {} };
      var screens = {
        lookup: root.querySelector('.rsvp-lookup'),
        wedding: root.querySelector('.rsvp-wedding'),
        rehearsal: root.querySelector('.rsvp-rehearsal'),
        welcome: root.querySelector('.rsvp-welcome'),
        done: root.querySelector('.rsvp-done')
      };

      function show(name) {
        Object.keys(screens).forEach(function (k) {
          screens[k].classList.toggle('is-active', k === name);
        });
        // Scroll the active scroll container back to the top on step change.
        var sc = root.closest('.mobile-scroll-container, .desktop-scroll-container');
        if (sc) sc.scrollTop = 0;
      }

      // A plus-one's typed First + Last name, collapsed to a single string.
      function guestFull(guest) {
        return (guest.first + ' ' + guest.last).replace(/\s+/g, ' ').trim();
      }
      // The name to display for a guest row. Plus-ones read "Your guest" while
      // being named on the wedding screen, then show that entered name on the
      // later screens (rehearsal / welcome party).
      function guestLabel(guest, kind) {
        if (!guest.plusOne) return guest.name;
        if (kind === 'wedding') return 'Your guest';
        return guestFull(guest) || 'Your guest';
      }

      // kind: "wedding" (dinner reveal + plus-one name) or "rehearsal" (attend only)
      function renderGuests(kind) {
        var host = root.querySelector('.rsvp-guests[data-kind="' + kind + '"]');
        host.textContent = '';
        state.guestList.forEach(function (guest) {
          state[kind][guest.id] = state[kind][guest.id] || { attending: null, meal: null, diet: '' };
          var answer = state[kind][guest.id];

          var row = document.createElement('div');
          row.className = 'rsvp-guest';

          var top = document.createElement('div');
          top.className = 'rsvp-guest-top';
          var nm = document.createElement('span');
          nm.className = 'rsvp-guest-name';
          nm.textContent = guestLabel(guest, kind);
          var pills = document.createElement('div');
          pills.className = 'rsvp-pills';
          top.appendChild(nm); top.appendChild(pills);
          row.appendChild(top);

          [['Will attend', true], ['Cannot attend', false]].forEach(function (opt) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'rsvp-pill';
            b.textContent = opt[0];
            b.setAttribute('aria-pressed', String(answer.attending === opt[1]));
            b.addEventListener('click', function () {
              answer.attending = opt[1];
              // declining clears the meal so we never submit a stale choice
              if (!opt[1]) { answer.meal = null; answer.diet = ''; }
              renderGuests(kind);
              updateNext(kind);
            });
            pills.appendChild(b);
          });

          if (kind === 'wedding') {
            if (answer.attending === true) row.classList.add('attending');
            var reveal = document.createElement('div');
            reveal.className = 'rsvp-reveal';

            // Plus-one: collect the guest's name (required) on the wedding RSVP.
            if (guest.plusOne) {
              var names = document.createElement('div');
              names.className = 'rsvp-guestname';
              [['First name', 'first'], ['Last name', 'last']].forEach(function (f) {
                var field = document.createElement('label');
                field.className = 'rsvp-field2';
                var fl = document.createElement('span');
                fl.className = 'rsvp-flabel';
                fl.textContent = f[0];
                var inp = document.createElement('input');
                inp.type = 'text';
                inp.value = guest[f[1]];
                inp.addEventListener('input', function (e) {
                  guest[f[1]] = e.target.value;
                  updateNext(kind);
                });
                field.appendChild(fl); field.appendChild(inp);
                names.appendChild(field);
              });
              reveal.appendChild(names);
            }

            var mealLabel = document.createElement('span');
            mealLabel.className = 'rsvp-flabel';
            mealLabel.textContent = 'Dinner choice';
            var meals = document.createElement('div');
            meals.className = 'rsvp-meals';
            RSVP_MEALS.forEach(function (meal) {
              var b = document.createElement('button');
              b.type = 'button';
              b.className = 'rsvp-meal';
              b.setAttribute('aria-pressed', String(answer.meal === meal));
              var dot = document.createElement('span');
              dot.className = 'rsvp-dot';
              b.appendChild(dot);
              b.appendChild(document.createTextNode(meal));
              b.addEventListener('click', function () {
                answer.meal = meal;
                renderGuests(kind);
                updateNext(kind);
              });
              meals.appendChild(b);
            });

            var diet = document.createElement('label');
            diet.className = 'rsvp-diet';
            var dietLabel = document.createElement('span');
            dietLabel.className = 'rsvp-flabel';
            dietLabel.textContent = 'Dietary restrictions';
            var dietInput = document.createElement('input');
            dietInput.type = 'text';
            dietInput.placeholder = 'Allergies or anything else the kitchen should know (optional)';
            dietInput.value = answer.diet;
            dietInput.addEventListener('input', function (e) { answer.diet = e.target.value; });
            diet.appendChild(dietLabel); diet.appendChild(dietInput);

            reveal.appendChild(mealLabel); reveal.appendChild(meals); reveal.appendChild(diet);
            row.appendChild(reveal);
          }

          host.appendChild(row);
        });
      }

      // every guest must answer; wedding attendees must also pick a meal, and a
      // plus-one must have a first + last name entered.
      function updateNext(kind) {
        var complete = state.guestList.every(function (guest) {
          var a = state[kind][guest.id];
          if (!a || a.attending === null) return false;
          if (kind === 'wedding' && a.attending) {
            if (!a.meal) return false;
            if (guest.plusOne && (!guest.first.trim() || !guest.last.trim())) return false;
          }
          return true;
        });
        root.querySelector('.rsvp-next[data-kind="' + kind + '"]').disabled = !complete;
      }

      // step 1: lookup
      root.querySelector('.rsvp-lookup-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var first = root.querySelector('.rsvp-first').value;
        var last = root.querySelector('.rsvp-last').value;
        var party = rsvpLookupParty(first, last);
        var msg = root.querySelector('.rsvp-lookup-msg');
        if (!party) {
          msg.innerHTML = 'We couldn&rsquo;t find that name. Check the spelling, or <a href="mailto:nolan.a.pollock@gmail.com">email us</a>.';
          msg.classList.add('rsvp-error');
          return;
        }
        msg.classList.remove('rsvp-error');
        msg.innerHTML = 'Can&rsquo;t find yourself? <a href="mailto:nolan.a.pollock@gmail.com">Email us</a>';
        state.party = party;
        state.guestList = party.guests.map(function (g, i) {
          return (typeof g === 'string')
            ? { id: 'g' + i, name: g, plusOne: false, first: '', last: '' }
            : { id: 'g' + i, name: '', plusOne: true, first: '', last: '' };
        });
        state.wedding = {}; state.rehearsal = {};
        root.querySelector('.rsvp-party-name').textContent = party.name;
        // Every party now has a second-event screen (rehearsal or welcome party)
        // after the wedding, so this button always continues.
        var wedNext = root.querySelector('.rsvp-next[data-kind="wedding"]');
        if (wedNext) wedNext.textContent = 'Continue';
        renderGuests('wedding');
        updateNext('wedding');
        show('wedding');
      });

      // step 2 -> 3: rehearsal guests see the rehearsal page; everyone else sees
      // the welcome party page (all guests are invited to the welcome party, and
      // rehearsal guests are assumed to be coming to it too).
      root.querySelector('.rsvp-next[data-kind="wedding"]').addEventListener('click', function () {
        var second = state.party.rehearsal ? 'rehearsal' : 'welcome';
        var sMsg = root.querySelector('.rsvp-submit-msg[data-kind="' + second + '"]');
        if (sMsg) { sMsg.classList.remove('rsvp-error'); sMsg.textContent = ''; }
        renderGuests(second);
        updateNext(second);
        show(second);
      });
      // step 3 -> 4 (either second-event screen submits the reply)
      root.querySelector('.rsvp-next[data-kind="rehearsal"]').addEventListener('click', finish);
      root.querySelector('.rsvp-next[data-kind="welcome"]').addEventListener('click', finish);

      // Split a fixed guest's "First Last" into { first, last }; plus-ones carry
      // the typed first/last directly.
      function firstLastOf(g) {
        if (g.plusOne) return { first: (g.first || '').trim(), last: (g.last || '').trim() };
        var parts = (g.name || '').trim().split(/\s+/);
        return { first: parts.shift() || '', last: parts.join(' ') };
      }

      function finish() {
        var second = state.party.rehearsal ? 'rehearsal' : 'welcome';
        var btn = root.querySelector('.rsvp-next[data-kind="' + second + '"]');
        var msg = root.querySelector('.rsvp-submit-msg[data-kind="' + second + '"]');
        if (msg) { msg.classList.remove('rsvp-error'); msg.textContent = ''; }
        var origLabel = btn ? btn.textContent : '';
        if (btn) { btn.disabled = true; btn.textContent = 'Sending\u2026'; }

        // Guest-centric payload matching the sheet's per-guest column blocks.
        // Each guest carries a reception answer plus exactly one second-event
        // answer: rehearsal parties send `rehearsal` (the sheet mirrors it into
        // the Welcome column), everyone else sends `welcome`.
        var guests = state.guestList.map(function (g) {
          var nm = firstLastOf(g);
          var rec = state.wedding[g.id] || {};
          var out = {
            first: nm.first,
            last: nm.last,
            reception: { attending: rec.attending === true, meal: rec.meal || '', diet: rec.diet || '' }
          };
          if (state.party.rehearsal) {
            out.rehearsal = { attending: (state.rehearsal[g.id] || {}).attending === true };
          } else {
            out.welcome = { attending: (state.welcome[g.id] || {}).attending === true };
          }
          return out;
        });
        var payload = { party: state.party.name, guests: guests };

        rsvpSubmit(payload).then(function () {
          if (btn) { btn.disabled = false; btn.textContent = origLabel; }
          renderSummary();
          show('done');
        }).catch(function () {
          if (btn) { btn.disabled = false; btn.textContent = origLabel; }
          if (msg) {
            msg.classList.add('rsvp-error');
            msg.innerHTML = 'Something went wrong sending your reply. Please try again, or <a href="mailto:nolan.a.pollock@gmail.com">email us</a>.';
          }
        });
      }

      function renderSummary() {
        function nameOf(g) { return g.plusOne ? (guestFull(g) || 'Your guest') : g.name; }
        function yes(kind) {
          return state.guestList.filter(function (g) { return state[kind][g.id] && state[kind][g.id].attending; });
        }
        function phrase(list) {
          if (!list.length) return 'Not attending';
          if (list.length === state.guestList.length) return list.length > 1 ? (list.length === 2 ? 'Both of you' : 'All of you') : nameOf(list[0]);
          return list.map(function (g) { return nameOf(g).split(' ')[0]; }).join(' & ') + ' only';
        }
        var rows = [['Wedding &middot; Dec 31', phrase(yes('wedding'))]];
        if (state.party.rehearsal) rows.push(['Rehearsal Dinner &middot; Dec 30', phrase(yes('rehearsal'))]);
        else rows.push(['Welcome Party &middot; Dec 30', phrase(yes('welcome'))]);

        var dl = root.querySelector('.rsvp-summary');
        dl.textContent = '';
        rows.forEach(function (r) {
          var row = document.createElement('div');
          row.className = 'rsvp-summary-row';
          var dt = document.createElement('dt');
          dt.innerHTML = r[0];
          var dd = document.createElement('dd');
          dd.textContent = r[1];
          row.appendChild(dt); row.appendChild(dd);
          dl.appendChild(row);
        });

        var going = yes('wedding').length > 0;
        root.querySelector('.rsvp-done-lede').textContent = going
          ? 'One very good excuse to stay up past midnight.'
          : 'We\u2019ll miss you \u2014 thank you for letting us know.';
      }

      // Reset back to step 1 (called on each navigation into the RSVP page).
      root._rsvpReset = function () {
        state.party = null; state.guestList = []; state.wedding = {}; state.rehearsal = {}; state.welcome = {};
        var f = root.querySelector('.rsvp-first'); if (f) f.value = '';
        var l = root.querySelector('.rsvp-last'); if (l) l.value = '';
        var msg = root.querySelector('.rsvp-lookup-msg');
        if (msg) { msg.classList.remove('rsvp-error'); msg.innerHTML = 'Can&rsquo;t find yourself? <a href="mailto:nolan.a.pollock@gmail.com">Email us</a>'; }
        root.querySelectorAll('.rsvp-submit-msg').forEach(function (m) { m.classList.remove('rsvp-error'); m.textContent = ''; });
        // Restore the second-event submit buttons in case a prior submit left one
        // disabled/stuck on "Sending…".
        root.querySelectorAll('.rsvp-next[data-kind="rehearsal"], .rsvp-next[data-kind="welcome"]').forEach(function (b) {
          b.disabled = true; b.textContent = 'Send our reply';
        });
        show('lookup');
      };
    }

    function showSection(sectionId) {
      // RSVP is hidden until launch-ready: redirect any access back to Home.
      if (sectionId === 'rsvp') sectionId = 'home';
      // Section title mapping
      const titles = {
        'home': 'we’re getting married',
        'photos': 'Photos',
        'qa': 'Frequently Asked',
        'travel': 'Hotels & Travel',
        'things': 'Things to Do',
        'rsvp': 'RSVP',
        'registry': 'Our Registry',
        'game': 'Game'
      };
      
      // Hide all sections
      document.querySelectorAll('.page-section').forEach(section => {
        section.classList.remove('active');
      });
      
      // Show selected section in both desktop and mobile containers
      document.querySelectorAll('#section-' + sectionId).forEach(section => {
        section.classList.add('active');
      });
      
      // Update nav active state (both desktop and mobile)
      document.querySelectorAll('.site-nav a, .mobile-menu nav a').forEach(link => {
        link.classList.remove('active');
      });
      
      // Add active to links that match the current section
      const sectionPath = sectionId === 'home' ? '/' : '/' + sectionId;
      document.querySelectorAll('.site-nav a, .mobile-menu nav a').forEach(link => {
        const href = link.getAttribute('href');
        if ((href === '/' && sectionId === 'home') || href === sectionPath) {
          link.classList.add('active');
        }
      });
      
      // Update mobile top bar title
      const mobileTitle = document.getElementById('mobilePageTitle');
      if (mobileTitle && titles[sectionId]) {
        mobileTitle.textContent = titles[sectionId];
      }
      
      // Toggle page-specific classes for mobile header hiding
      const mainContent = document.getElementById('mainContent');
      if (mainContent) {
        // Photos page
        if (sectionId === 'photos') {
          mainContent.classList.add('photos-page-active');
          // Re-randomize the swipe deck order + counts on each visit
          document.querySelectorAll('.photos-root').forEach(function (r) {
            if (r._pgReshuffle) r._pgReshuffle();
          });
        } else {
          mainContent.classList.remove('photos-page-active');
        }
        // Registry page
        if (sectionId === 'registry') {
          mainContent.classList.add('registry-page-active');
        } else {
          mainContent.classList.remove('registry-page-active');
        }
        // Q+A page
        if (sectionId === 'qa') {
          mainContent.classList.add('qa-page-active');
          startBouncer();
        } else {
          mainContent.classList.remove('qa-page-active');
          stopBouncer();
        }
        // Travel page
        if (sectionId === 'travel') {
          mainContent.classList.add('travel-page-active');
        } else {
          mainContent.classList.remove('travel-page-active');
        }
        // Game page (start/stop the animation loop as you enter/leave)
        if (sectionId === 'game') {
          mainContent.classList.add('game-page-active');
          gameEnter();
        } else {
          mainContent.classList.remove('game-page-active');
          gameLeave();
        }
        // Home page (controls the mobile top-bar brand mark)
        if (sectionId === 'home') {
          mainContent.classList.add('home-page-active');
        } else {
          mainContent.classList.remove('home-page-active');
        }
        // RSVP page — start each visit fresh at the lookup step
        if (sectionId === 'rsvp') {
          mainContent.classList.add('rsvp-page-active');
          document.querySelectorAll('.rsvp-root').forEach(function (r) {
            if (r._rsvpReset) r._rsvpReset();
          });
        } else {
          mainContent.classList.remove('rsvp-page-active');
        }
      }
      
      // Update URL without page reload (preserve base path)
      const basePath = getBasePath();
      const path = sectionId === 'home' ? basePath + '/' : basePath + '/' + sectionId;
      window.history.pushState({ section: sectionId }, '', path);
      
      // Close mobile menu if open
      const menu = document.getElementById('mobileMenu');
      const hamburger = document.querySelector('.hamburger');
      if (menu) menu.classList.remove('active');
      if (hamburger) hamburger.classList.remove('active');
      
      return false;
    }
    
    // Handle browser back/forward buttons
    window.addEventListener('popstate', function(e) {
      if (e.state && e.state.section) {
        showSectionFromUrl(e.state.section);
      } else {
        // Default to home if no state
        showSectionFromUrl('home');
      }
    });

    function showSectionFromUrl(sectionId) {

        'qa': 'Frequently Asked',
        'travel': 'Hotels & Travel',
        'things': 'Things to Do',
        'rsvp': 'RSVP',
        'registry': 'Our Registry',

      document.querySelectorAll('.page-section').forEach(section => {

      document.querySelectorAll('#section-' + sectionId).forEach(section => {

      });

      const sectionPath = sectionId === 'home' ? '/' : '/' + sectionId;
      document.querySelectorAll('.site-nav a, .mobile-menu nav a').forEach(link => {
        const href = link.getAttribute('href');
        if ((href === '/' && sectionId === 'home') || href === sectionPath) {

      const mobileTitle = document.getElementById('mobilePageTitle');
      if (mobileTitle && titles[sectionId]) {

      }
      
      // Toggle page-specific classes for mobile header hiding
      const mainContent = document.getElementById('mainContent');
      if (mainContent) {
        // Photos page
        if (sectionId === 'photos') {
          mainContent.classList.add('photos-page-active');
          // Re-randomize the swipe deck order + counts on each visit
          document.querySelectorAll('.photos-root').forEach(function (r) {
            if (r._pgReshuffle) r._pgReshuffle();
          });
        } else {
          mainContent.classList.remove('photos-page-active');
        }
        // Registry page
        if (sectionId === 'registry') {
          mainContent.classList.add('registry-page-active');
        } else {
          mainContent.classList.remove('registry-page-active');
        }
        // Q+A page
        if (sectionId === 'qa') {
          mainContent.classList.add('qa-page-active');
          startBouncer();
        } else {
          mainContent.classList.remove('qa-page-active');
          stopBouncer();
        }
        // Travel page
        if (sectionId === 'travel') {
          mainContent.classList.add('travel-page-active');
        } else {
          mainContent.classList.remove('travel-page-active');
        }
        // Game page (start/stop the animation loop as you enter/leave)
        if (sectionId === 'game') {
          mainContent.classList.add('game-page-active');
          gameEnter();
        } else {
          mainContent.classList.remove('game-page-active');
          gameLeave();
        }
        // Home page (controls the mobile top-bar brand mark)
        if (sectionId === 'home') {
          mainContent.classList.add('home-page-active');
        } else {
          mainContent.classList.remove('home-page-active');
        }
        // RSVP page — start each visit fresh at the lookup step
        if (sectionId === 'rsvp') {
          mainContent.classList.add('rsvp-page-active');
          document.querySelectorAll('.rsvp-root').forEach(function (r) {
            if (r._rsvpReset) r._rsvpReset();
          });
        } else {
          mainContent.classList.remove('rsvp-page-active');
        }
      }
    }
    
  </script>
